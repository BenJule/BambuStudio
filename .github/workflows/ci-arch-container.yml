name: 'CI: Build Arch Linux container'
run-name: "Build archlinux image — ${{ github.ref_name }}"

on:
  schedule:
    - cron: '0 3 * * 1'  # weekly Monday 03:00 UTC — tracks upstream archlinux:base updates
  push:
    paths:
      - 'docker/Dockerfile.archlinux'
      - '.github/workflows/ci-arch-container.yml'
  workflow_dispatch:

permissions: read-all

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and push archlinux image
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411  # v2.19.4
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5  # v4.1.0

      - name: Log in to ghcr.io
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee  # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set lowercase owner
        run: echo "IMAGE_OWNER=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: Build and push
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf  # v7.2.0
        with:
          context: docker
          file: docker/Dockerfile.archlinux
          push: true
          # No build attestation — avoids the extra "unknown/unknown" manifest
          # entry GHCR shows for the provenance attestation.
          provenance: false
          tags: |
            ghcr.io/${{ env.IMAGE_OWNER }}/bambu-archlinux:base
            ghcr.io/${{ env.IMAGE_OWNER }}/bambu-archlinux:latest
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ github.event.head_commit.timestamp }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
