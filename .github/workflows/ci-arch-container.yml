name: 'CI: Build Arch Linux container'
run-name: "Build archlinux image — ${{ github.ref_name }}"

on:
  schedule:
    - cron: '0 3 * * 1'  # weekly Monday 03:00 UTC — tracks upstream archlinux:base updates
  push:
    paths:
      - 'docker/Dockerfile.archlinux'
      - '.github/workflows/ci-arch-container.yml'
  workflow_dispatch:

permissions: read-all

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and push archlinux image
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1  # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      - name: Log in to ghcr.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set lowercase owner
        run: echo "IMAGE_OWNER=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: docker
          file: docker/Dockerfile.archlinux
          push: true
          # No build attestation — avoids the extra "unknown/unknown" manifest
          # entry GHCR shows for the provenance attestation.
          provenance: false
          tags: |
            ghcr.io/${{ env.IMAGE_OWNER }}/bambu-archlinux:base
            ghcr.io/${{ env.IMAGE_OWNER }}/bambu-archlinux:latest
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ github.event.head_commit.timestamp }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
