name: 'Security: Dependency Review'
run-name: "Dependency review — PR #${{ github.event.pull_request.number }}"

on:
  pull_request:
    branches: [master]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    name: Review dependency changes
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1  # v2.21.1
        with:
          egress-policy: block
          # Use folded (>), NOT literal (|): harden-runner splits allowed-endpoints on
          # whitespace, so a newline-separated literal list collapses into one malformed
          # entry and github.com is never recognised -> checkout's git-fetch is blocked
          # ("domain not allowed: github.com" despite being listed). The detect_changes
          # job in cd-nightly uses this exact folded form and its checkout works.
          allowed-endpoints: >
            api.github.com:443
            github.com:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Dependency Review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294  # v5.0.0
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure
