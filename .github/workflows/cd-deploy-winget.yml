name: 'CD: WinGet'
run-name: "WinGet update — ${{ github.event.release.tag_name || inputs.version }}"
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release tag (e.g. v02.07.00.55)'
        required: true
        type: string

# Automatic release trigger disabled until BenJule.BambuStudio is submitted
# to microsoft/winget-pkgs. Enable by adding:
#   release:
#     types: [released]

permissions: read-all

concurrency:
  group: cd-deploy-winget
  cancel-in-progress: false

jobs:
  publish:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25  # v2.22.1
        with:
          egress-policy: block
          allowed-endpoints: |
            api.github.com:443
            github.com:443
      - uses: vedantmgoyal9/winget-releaser@b7370d4d152efdce803a26cc6ca9eee58cb2ad54  # v2
        with:
          identifier: BenJule.BambuStudio
          version: ${{ github.event.release.tag_name || inputs.version }}
          token: ${{ secrets.WINGET_TOKEN }}
          installers-regex: '\.exe$'