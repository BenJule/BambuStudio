name: 'CD: Release'
run-name: "Release ${{ github.ref_name || inputs.tag }}"

on:
  push:
    tags:
      - 'v[0-9]*.[0-9]*.[0-9]*.[0-9]*-bj.[0-9]*'
      - 'v[0-9]*.[0-9]*.[0-9]*.[0-9]*-dev'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v02.07.00.145-bj.1) — leave empty to auto-compute'
        required: false
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions: read-all

jobs:
  prepare:
    name: Determine release tag
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      prev_tag: ${{ steps.tag.outputs.prev_tag }}
    permissions:
      contents: read

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411  # v2.19.4
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            github.com:443

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          fetch-depth: 0

      - name: Compute tag
        id: tag
        run: |
          if [[ "${{ github.event_name }}" == "push" ]]; then
            tag="${{ github.ref_name }}"
          elif [[ -n "${{ inputs.tag }}" ]]; then
            tag="${{ inputs.tag }}"
          else
            base=$(grep 'set(SLIC3R_VERSION_BASE' version.inc | cut -d '"' -f2)
            count=$(git rev-list --count HEAD)
            tag="v${base}.${count}-bj.0"
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          # Exclude the new tag itself (does not exist yet for workflow_dispatch)
          prev_tag=$(git tag --sort=-version:refname \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+-(bj\.[0-9]+|dev)$' \
            | grep -v "^${tag}$" \
            | head -1 || echo "")
          echo "prev_tag=${prev_tag}" >> "$GITHUB_OUTPUT"

      - name: Show tag
        run: echo "Releasing ${{ steps.tag.outputs.tag }}"

  generate_changelog:
    name: Generate Claude changelog
    needs: [prepare]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    continue-on-error: true
    permissions:
      contents: read

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411  # v2.19.4
        with:
          egress-policy: audit

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          fetch-depth: 0

      - name: Install Claude CLI
        run: npm install -g @anthropic-ai/claude-code@2.1.152

      - name: Generate changelog
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TAG: ${{ needs.prepare.outputs.tag }}
          PREV_TAG: ${{ needs.prepare.outputs.prev_tag }}
        run: |
          if [ -n "$PREV_TAG" ]; then
            COMMIT_LOG=$(git log "${PREV_TAG}..HEAD" --oneline --no-merges | head -100)
            RANGE="${PREV_TAG}..HEAD"
          else
            COMMIT_LOG=$(git log --oneline --no-merges | head -100)
            RANGE="initial"
          fi

          # Write prompt to temp file to avoid multi-line YAML quoting issues
          {
            echo "Generate a concise, user-facing changelog in Markdown for BambuStudio release ${TAG}."
            echo ""
            echo "Previous release: ${PREV_TAG:-(first release)}"
            echo "Commit range: ${RANGE}"
            echo ""
            echo "Commits:"
            echo "${COMMIT_LOG}"
            echo ""
            echo "Instructions:"
            echo "- Write for end users, not developers."
            echo "- Group into sections: Features, Bug Fixes, Improvements, CI/Infrastructure (omit empty sections)."
            echo "- Each bullet: one sentence, imperative mood, no commit hashes."
            echo "- Max 30 bullets total."
            echo "- Output only the Markdown, no preamble or explanation."
          } > /tmp/changelog_prompt.txt

          timeout 300 claude --dangerously-skip-permissions -p "$(cat /tmp/changelog_prompt.txt)" \
            > changelog.md

          echo "=== Generated changelog ==="
          cat changelog.md

      - name: Upload changelog artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: changelog
          path: changelog.md
          retention-days: 7

  build_packages:
    name: Build Debian .deb + Fedora .rpm
    needs: [prepare]
    uses: ./.github/workflows/cd-packages.yml
    with:
      retention-days: 90
    secrets: inherit

  # ── Fast builds: separate named jobs for independent re-runs ──────────────
  build_ubuntu_2204:
    name: Build ubuntu-22.04
    needs: [prepare, build_packages]
    if: needs.build_packages.result != 'failure'
    uses: ./.github/workflows/_build-cached.yml
    with:
      os: ubuntu-22.04
      build-deps-only: false
    secrets: inherit

  build_ubuntu_2404:
    name: Build ubuntu-24.04
    needs: [prepare, build_packages]
    if: needs.build_packages.result != 'failure'
    uses: ./.github/workflows/_build-cached.yml
    with:
      os: ubuntu-24.04
      build-deps-only: false
    secrets: inherit

  build_ubuntu_2404_arm:
    name: Build ubuntu-24.04-arm
    needs: [prepare, build_packages]
    if: needs.build_packages.result != 'failure'
    uses: ./.github/workflows/_build-cached.yml
    with:
      os: ubuntu-24.04-arm
      build-deps-only: false
    secrets: inherit

  build_windows_x64:
    name: Build windows-2022
    needs: [prepare, build_packages]
    if: needs.build_packages.result != 'failure'
    uses: ./.github/workflows/_build-cached.yml
    with:
      os: windows-2022
      arch: x64
      build-deps-only: false
    secrets: inherit

  # ── Slow builds: separate named jobs for independent re-runs ────────────────
  build_macos_intel:
    name: Build macos-15-intel
    needs: [prepare]
    uses: ./.github/workflows/_build-cached.yml
    with:
      os: macos-15-intel
      arch: x86_64
      build-deps-only: false
    secrets: inherit

  build_macos_15:
    name: Build macos-15
    needs: [prepare]
    uses: ./.github/workflows/_build-cached.yml
    with:
      os: macos-15
      arch: universal
      build-deps-only: false
    secrets: inherit

  build_macos_26:
    name: Build macos-26
    needs: [prepare]
    uses: ./.github/workflows/_build-cached.yml
    with:
      os: macos-26
      arch: universal
      build-deps-only: false
    secrets: inherit

  build_windows_arm:
    name: Build windows-11-arm
    needs: [prepare]
    uses: ./.github/workflows/_build-cached.yml
    with:
      os: windows-11-arm
      arch: arm64
      build-deps-only: false
    secrets: inherit

  create_release:
    name: Publish release
    needs: [prepare, generate_changelog, build_packages, build_ubuntu_2204, build_ubuntu_2404, build_ubuntu_2404_arm, build_windows_x64]
    if: |
      always() &&
      needs.prepare.result == 'success' &&
      needs.build_packages.result == 'success' &&
      needs.build_ubuntu_2204.result == 'success' &&
      needs.build_ubuntu_2404.result == 'success' &&
      needs.build_ubuntu_2404_arm.result == 'success' &&
      needs.build_windows_x64.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: production
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411  # v2.19.4
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          fetch-depth: 0

      - name: Download all build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v4
        with:
          path: release-assets/
          merge-multiple: true

      - name: Remove build-only dependency tarballs
        run: |
          # _build-deps.yml uploads BambuStudio_dep_* tarballs (macOS/Windows
          # deps, ~250 MB each) as run artifacts. They are build inputs, not
          # user-facing release assets — strip them before publishing.
          find release-assets/ -name 'BambuStudio_dep_*' -type f -print -delete || true

      - name: Prepare changelog
        run: |
          if [ -f release-assets/changelog.md ]; then
            mv release-assets/changelog.md ./changelog.md
          else
            printf '## Changes\n\nSee commit history for details.\n' > changelog.md
          fi

      - name: List assets
        run: find release-assets/ -type f | sort

      - name: Generate SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610  # v0.24.0
        with:
          path: release-assets/
          format: spdx-json
          output-file: release-assets/BambuStudio-${{ needs.prepare.outputs.tag }}.sbom.spdx.json
          upload-artifact: false

      - name: Generate checksums
        run: bash scripts/generate-checksums.sh release-assets/

      - name: Attest build provenance
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32  # v4.1.0
        with:
          subject-path: release-assets/**

      - name: Import GPG signing key
        uses: ./.github/actions/setup-gpg
        with:
          signing-key: ${{ secrets.GIT_SIGNING_KEY }}
          signing-key-passphrase: ${{ secrets.GIT_SIGNING_KEY_PASSPHRASE }}
          signing-key-id: ${{ secrets.GIT_SIGNING_KEY_ID }}

      - name: Publish release
        env:
          # Use the PAT (not GITHUB_TOKEN) so the release `released` event triggers
          # the deploy workflows — GitHub suppresses workflow-triggered events that
          # originate from the default GITHUB_TOKEN (recursion prevention).
          GH_TOKEN: ${{ secrets.WORKFLOW_PAT }}
        run: |
          TAG="${{ needs.prepare.outputs.tag }}"
          COMMIT_SHA=$(git rev-parse HEAD)
          mapfile -d '' ASSETS < <(find release-assets/ -type f -print0)

          if gh release view "$TAG" --repo "${{ github.repository }}" &>/dev/null; then
            echo "Release $TAG already exists — uploading any missing assets"
            gh release upload "$TAG" "${ASSETS[@]}" \
              --repo "${{ github.repository }}" \
              --clobber
          else
            # Create a SIGNED annotated tag at the built commit so final release
            # tags are GPG-signed like the nightly/RC tags — the git refs API only
            # creates a lightweight, unsigned tag. Rerun-safe: drop any stale local
            # tag, then force-push. gh release create then reuses the existing tag
            # (no --target, which would hit HTTP 403 cli/cli#9514 with the token).
            git tag -d "$TAG" 2>/dev/null || true
            git tag -s "$TAG" -m "BambuStudio $TAG" "$COMMIT_SHA"
            git push --force "https://x-access-token:${{ secrets.WORKFLOW_PAT }}@github.com/${GITHUB_REPOSITORY}" "refs/tags/${TAG}"
            gh release create "$TAG" \
              --repo "${{ github.repository }}" \
              --title "BambuStudio $TAG" \
              --notes-file changelog.md \
              --latest \
              "${ASSETS[@]}"
          fi

  # ── Attach macOS + ARM64 Windows after slow builds finish ───────────────────
  attach_slow:
    name: Attach macOS + ARM64 Windows to release
    needs: [prepare, create_release, build_macos_intel, build_macos_15, build_macos_26, build_windows_arm]
    if: always() && needs.create_release.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: production
    permissions:
      contents: write

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411  # v2.19.4
        with:
          egress-policy: audit

      - name: Download macOS artifacts
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v4
        with:
          path: slow-assets/
          pattern: BambuStudio_macos-*_dmg
          merge-multiple: true

      - name: Download Windows ARM64 artifact
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v4
        with:
          path: slow-assets/
          pattern: BambuStudio_windows_arm64_*
          merge-multiple: true

      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${{ needs.prepare.outputs.tag }}"
          mapfile -t FILES < <(find slow-assets/ -type f 2>/dev/null | sort)
          if [ ${#FILES[@]} -eq 0 ]; then
            echo "No slow-build artifacts found — nothing to attach"
            exit 0
          fi
          echo "Attaching ${#FILES[@]} file(s) to release $TAG:"
          printf '  %s\n' "${FILES[@]}"
          gh release upload "$TAG" "${FILES[@]}" \
            --repo "${{ github.repository }}" \
            --clobber
          echo "### Slow-build assets attached to release" >> "$GITHUB_STEP_SUMMARY"
          printf -- '- %s\n' "${FILES[@]##*/}" >> "$GITHUB_STEP_SUMMARY"

  smoke_test:
    name: Smoke test .deb
    needs: [prepare, create_release]
    if: needs.create_release.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    continue-on-error: true
    permissions:
      contents: read

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411  # v2.19.4
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: Download Debian .deb artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v4
        with:
          path: ./smoke/
          pattern: BambuStudio_debian-trixie_deb_*
          merge-multiple: true

      - name: Locate .deb
        run: |
          DEB=$(find ./smoke/ -name "*.deb" | head -1)
          if [ -z "$DEB" ]; then
            echo "::error::No .deb artifact found"
            exit 1
          fi
          echo "DEB=$DEB" >> "$GITHUB_ENV"

      - name: Run smoke test
        uses: ./.github/actions/smoke-test-deb
        with:
          deb-path: ${{ env.DEB }}

      - name: Post warning on failure
        if: failure()
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          # NEVER delete an already-published release from the smoke test.
          # The smoke test installs the .deb on a GitHub-hosted runner whose
          # apt mirror can transiently 404 on dependencies (libwebkit2gtk,
          # gstreamer...), making ldd report missing libs even though the .deb
          # itself is fine. A flaky mirror must not destroy a complete release.
          # Matches the non-destructive behaviour of the RC and Nightly smoke tests.
          {
            echo "## ⚠️ Release Smoke Test Failed"
            echo ""
            echo "The post-publish smoke test failed for release \`${TAG}\`."
            echo "The release was **NOT** deleted — this is usually a transient apt"
            echo "mirror issue on the runner, not a packaging defect. Verify the .deb"
            echo "manually before announcing the release."
            echo ""
            echo "- Release: https://github.com/${{ github.repository }}/releases/tag/${TAG}"
            echo "- Run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          } >> "$GITHUB_STEP_SUMMARY"
