name: '_: Check Cache'

on:
  workflow_call:
    inputs:
      os:
        required: true
        type: string
      arch:
        required: false
        type: string
      build-deps-only:
        required: false
        type: boolean

permissions: read-all

jobs:
  check_cache:
    name: Check Cache
    runs-on: ${{ inputs.os }}
    timeout-minutes: 10
    outputs:
      cache-key:  ${{ steps.set_outputs.outputs.cache-key }}
      cache-path: ${{ steps.set_outputs.outputs.cache-path }}
      valid-cache: ${{ steps.cache_deps.outputs.cache-hit }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c  # v2.21.0
        continue-on-error: true
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          lfs: 'false'

      - name: Set cache key and path
        id: set_outputs
        shell: bash
        env:
          INPUT_OS:   ${{ inputs.os }}
          INPUT_ARCH: ${{ inputs.arch }}
          DEPS_HASH:  ${{ hashFiles('deps/**') }}
          # OS-specific subfolder inside deps/build that gets cached
          DEP_FOLDER: ${{ startsWith(inputs.os, 'windows-') && '/BambuStudio_dep'
            || startsWith(inputs.os, 'macos-') && ''
            || '/destdir' }}
        run: |
          set -euo pipefail
          arch_suffix="${INPUT_ARCH:+-${INPUT_ARCH}}"
          echo "cache-key=${INPUT_OS}${arch_suffix}-cache-bambustudio_deps-build-${DEPS_HASH}" >> "$GITHUB_OUTPUT"
          echo "cache-path=${GITHUB_WORKSPACE}/deps/build${DEP_FOLDER}"          >> "$GITHUB_OUTPUT"

      - name: Lookup cache (no restore)
        id: cache_deps
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v5
        with:
          path: ${{ steps.set_outputs.outputs.cache-path }}
          key:  ${{ steps.set_outputs.outputs.cache-key }}
          lookup-only: true

  build_deps:
    name: Build Deps
    needs: [check_cache]
    uses: ./.github/workflows/_build-deps.yml
    with:
      cache-key:       ${{ needs.check_cache.outputs.cache-key }}
      cache-path:      ${{ needs.check_cache.outputs.cache-path }}
      valid-cache:     ${{ needs.check_cache.outputs.valid-cache == 'true' }}
      os:              ${{ inputs.os }}
      arch:            ${{ inputs.arch }}
      build-deps-only: ${{ inputs.build-deps-only }}
    secrets: inherit
