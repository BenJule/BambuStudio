name: '_: Build Deps'
on:
  workflow_call:
    inputs:
      cache-key:
        required: true
        type: string
      cache-path:
        required: true
        type: string
      valid-cache:
        required: true
        type: boolean
      os:
        required: true
        type: string
      arch:
        required: false
        type: string
      build-deps-only:
        required: false
        type: boolean

permissions: read-all
jobs:
  build_deps:
    name: Build Deps
    if: inputs.build-deps-only || inputs.valid-cache != true
    runs-on: ${{ inputs.os }}
    timeout-minutes: 240
    env:
      date:
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c  # v2.21.0
        with:
          egress-policy: audit

      # Setup the environment
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          lfs: 'true'

      - name: load cached deps
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v5
        with:
          path: ${{ inputs.cache-path }}
          key: ${{ inputs.cache-key }}

      - name: setup dev on Windows
        if: startsWith(inputs.os, 'windows-')
        uses: microsoft/setup-msbuild@30375c66a4eea26614e0d39710365f22f8b0af57  # v3

      - name: Install cmake 3.31.x (Windows)
        if: startsWith(inputs.os, 'windows-')
        uses: lukka/get-cmake@fffaaafeea488556c2c12dad60690008bc1caacb  # v4.4.2
        with:
          cmakeVersion: "~3.31.0"
          useLocalCache: true
          useCloudCache: true

      - name: Get the date on Ubuntu and macOS
        if: ${{ !startsWith(inputs.os, 'windows-') }}
        run: echo "date=$(date +'%Y%m%d')" >> $GITHUB_ENV
        shell: bash

      - name: Get the date on Windows
        if: startsWith(inputs.os, 'windows-')
        run: echo "date=$(Get-Date -Format 'yyyyMMdd')" | Out-File -Append -FilePath $env:GITHUB_ENV -Encoding utf8
        shell: pwsh


      # Build Dependencies
      - name: Build on Windows
        if: startsWith(inputs.os, 'windows-')
        working-directory: ${{ github.workspace }}
        shell: pwsh
        env:
          INPUT_ARCH: ${{ inputs.arch }}
        run: |
            $vsArch = if ($env:INPUT_ARCH -eq "arm64") { "ARM64" } else { "x64" }
            choco install strawberryperl -y --no-progress
            $msys2Root = "C:\msys64"
            if (-not (Test-Path "$msys2Root\usr\bin\pacman.exe")) {
              $msys2Root = "C:\tools\msys64"
              if (-not (Test-Path "$msys2Root\usr\bin\pacman.exe")) {
                choco install msys2 -y --no-progress
              }
            }
            & "$msys2Root\usr\bin\pacman.exe" -S --noconfirm mingw-w64-x86_64-pkgconf
            if ($LASTEXITCODE -ne 0) { throw "pacman failed to install mingw-w64-x86_64-pkgconf (exit $LASTEXITCODE)" }
            $env:PATH = "$msys2Root\mingw64\bin;$env:PATH"
            Add-Content $env:GITHUB_PATH "$msys2Root\mingw64\bin"
            New-Item -ItemType Directory -Force -Path "deps\build\BambuStudio_dep" | Out-Null
            Push-Location "deps\build"
            cmake ../ -G "Visual Studio 17 2022" -A $vsArch -DDESTDIR="./BambuStudio_dep" -DCMAKE_BUILD_TYPE=Release -DDEP_DEBUG=OFF
            msbuild /m ALL_BUILD.vcxproj
            Pop-Location

      - name: pack deps on Windows
        if: startsWith(inputs.os, 'windows-')
        working-directory: ${{ github.workspace }}
        shell: pwsh
        env:
          INPUT_OS: ${{ inputs.os }}
        run: |
          $os   = $env:INPUT_OS
          $date = "${{ env.date }}"
          Compress-Archive -Path "$env:GITHUB_WORKSPACE\deps\build\BambuStudio_dep\*" `
            -DestinationPath "$env:GITHUB_WORKSPACE\deps\build\BambuStudio_dep_${os}_${date}_vs2022.zip"

      - name: Fix python install error on mac
        if: inputs.os == 'macos-15-intel'
        working-directory: ${{ github.workspace }}
        run: |
          find /usr/local/bin -lname '*/Library/Frameworks/Python.framework/*' -delete
          sudo rm -rf /Library/Frameworks/Python.framework/
          brew install --force python3 && brew unlink python3 && brew link --overwrite python3

      - name: Free disk space
        if: inputs.os == 'macos-15' || inputs.os == 'macos-26'
        run: |
          df -h
          sudo find /Applications -maxdepth 1 -type d -name "Xcode_*.app" ! -name "Xcode_15.4.app" -exec rm -rf {} +
          sudo rm -rf ~/Library/Developer/CoreSimulator/Caches/*
          df -h

      - name: Install numpy for FFmpeg on macOS ARM
        if: inputs.os == 'macos-15' || inputs.os == 'macos-26'
        run: |
          # FFmpeg's configure requires numpy.distutils (removed in numpy 2.0).
          # numpy 1.26.4 binary wheels for Python 3.12+ ship without numpy.distutils
          # because Python 3.12 removed distutils from its stdlib.
          # Python 3.11 still includes distutils, so numpy.distutils works there.
          brew install python@3.11
          /opt/homebrew/opt/python@3.11/bin/pip3.11 install "numpy==1.26.4" --break-system-packages
          /opt/homebrew/opt/python@3.11/bin/python3.11 -c "import numpy; import numpy.distutils"
          echo "/opt/homebrew/opt/python@3.11/bin" >> "$GITHUB_PATH"

      - name: Install cmake 3.31.x (macOS)
        if: startsWith(inputs.os, 'macos-')
        uses: lukka/get-cmake@fffaaafeea488556c2c12dad60690008bc1caacb  # v4.4.2
        with:
          cmakeVersion: "~3.31.0"
          useLocalCache: true
          useCloudCache: true

      - name: Cache Homebrew downloads (macOS)
        if: startsWith(inputs.os, 'macos-')
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v5
        with:
          path: ~/Library/Caches/Homebrew/downloads
          key: brew-deps-${{ inputs.os }}-${{ hashFiles('.github/workflows/_build-deps.yml') }}
          restore-keys: |
            brew-deps-${{ inputs.os }}-

      - name: Build on Mac x86_64
        if: startsWith(inputs.os, 'macos-') && inputs.arch == 'x86_64'
        working-directory: ${{ github.workspace }}
        run: |
            brew install automake texinfo nasm yasm x264
            # Retry the dependency build: CMake ExternalProject downloads
            # third-party tarballs from GitHub, which intermittently return
            # HTTP 5xx. Already-built deps are skipped on retry.
            retry() {
              local n=1 max=3
              until "$@"; do
                if [ "$n" -ge "$max" ]; then
                  echo "::error::dependency build failed after ${n} attempts"; return 1
                fi
                echo "::warning::dependency build attempt ${n}/${max} failed (likely a transient download), retrying in 30s…"
                n=$((n + 1)); sleep 30
              done
            }
            retry ./BuildMac.sh -d -x -a x86_64 -t 10.15 -1
            (cd "${{ github.workspace }}/deps/build/x86_64" && \
            find . -mindepth 1 -maxdepth 1 ! -name 'BambuStudio_deps' -exec rm -rf {} +)
            brew list zstd &>/dev/null || brew install zstd

      - name: Build on Mac universal (arm64 + x86_64)
        if: startsWith(inputs.os, 'macos-') && inputs.arch != 'x86_64'
        working-directory: ${{ github.workspace }}
        run: |
            brew install automake texinfo nasm yasm x264
            # Retry the dependency build (transient GitHub 5xx on tarball
            # downloads); already-built deps are skipped on retry.
            retry() {
              local n=1 max=3
              until "$@"; do
                if [ "$n" -ge "$max" ]; then
                  echo "::error::dependency build failed after ${n} attempts"; return 1
                fi
                echo "::warning::dependency build attempt ${n}/${max} failed (likely a transient download), retrying in 30s…"
                n=$((n + 1)); sleep 30
              done
            }
            retry ./BuildMac.sh -d -x -a universal -t 10.15 -1
            for arch in arm64 x86_64; do
                (cd "${{ github.workspace }}/deps/build/${arch}" && \
                find . -mindepth 1 -maxdepth 1 ! -name 'BambuStudio_deps' -exec rm -rf {} +)
            done
            brew list zstd &>/dev/null || brew install zstd

      - name: pack deps on Macos
        if: startsWith(inputs.os, 'macos-')
        working-directory: ${{ github.workspace }}
        run: |
          cd ${{ github.workspace }}/deps
          tar -zcvf "BambuStudio_dep_mac_${{ inputs.arch }}_$(date +"%Y%m%d").tar.gz" build


      - name: Build on Ubuntu
        if: startsWith(inputs.os, 'ubuntu-')
        working-directory: ${{ github.workspace }}
        run: |
            sudo ./BuildLinux.sh -ur
            sudo chown $USER -R ./
            # Retry the dependency build (transient GitHub 5xx on tarball
            # downloads); already-built deps are skipped on retry.
            retry() {
              local n=1 max=3
              until "$@"; do
                if [ "$n" -ge "$max" ]; then
                  echo "::error::dependency build failed after ${n} attempts"; return 1
                fi
                echo "::warning::dependency build attempt ${n}/${max} failed (likely a transient download), retrying in 30s…"
                n=$((n + 1)); sleep 30
              done
            }
            retry ./BuildLinux.sh -dfr
            cd deps/build
            tar -czvf BambuStudio_dep_${{ inputs.os }}_$(date +"%Y%m%d").tar.gz destdir

      # Upload Artifacts
      - name: Upload Mac ${{ inputs.arch }} artifacts
        if: startsWith(inputs.os, 'macos-')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: BambuStudio_dep_${{ inputs.os }}_${{ inputs.arch }}_${{ env.date }}
          path: ${{ github.workspace }}/deps/BambuStudio_dep_mac_${{ inputs.arch }}*.tar.gz

      - name: clean artifacts
        if: startsWith(inputs.os, 'macos-')
        working-directory: ${{ github.workspace }}
        run: rm -rf ${{ github.workspace }}/deps/build/BambuStudio_dep_mac_${{ inputs.arch }}*.tar.gz

      - name: Upload Windows artifacts
        if: startsWith(inputs.os, 'windows-')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: BambuStudio_dep_${{ inputs.os }}_${{ env.date }}
          path: ${{ github.workspace }}/deps/build/BambuStudio_dep*.zip

      - name: Upload Ubuntu artifacts
        if: ${{ ! env.ACT && startsWith(inputs.os, 'ubuntu-') }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: BambuStudio_dep_${{ inputs.os }}_${{ env.date }}
          path: ${{ github.workspace }}/deps/build/BambuStudio_dep_${{ inputs.os }}_*.tar.gz

  build_Bambu:
    name: Build BambuStudio
    needs: [build_deps]
    if: ${{ !cancelled() && !inputs.build-deps-only && (inputs.valid-cache == true && needs.build_deps.result == 'skipped') || (inputs.valid-cache != true && success()) }}
    uses: ./.github/workflows/_build-core.yml
    with:
      cache-key:  ${{ inputs.cache-key }}
      cache-path: ${{ inputs.cache-path }}
      os:         ${{ inputs.os }}
      arch:       ${{ inputs.arch }}
    secrets: inherit
