name: 'CD: Release Candidate'
run-name: "RC — ${{ github.ref_name }}"

on:
  push:
    branches:
      - 'release/**'
  workflow_dispatch: {}

permissions: read-all

concurrency:
  group: release-candidate-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  # ── 1. Distribution packages (Debian .deb, Fedora .rpm, self-hosted) ──────
  build_packages:
    name: Build distribution packages
    uses: ./.github/workflows/cd-packages.yml
    with:
      retention-days: 30
    secrets: inherit

  # ── 2. GitHub-hosted platforms (Ubuntu AppImage, Windows, macOS) ──────────
  build_platforms:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            name: Linux / Ubuntu 22.04
          - os: ubuntu-24.04
            name: Linux / Ubuntu 24.04
          - os: ubuntu-24.04-arm
            name: Linux / Ubuntu 24.04 ARM
          - os: windows-2022
            arch: x64
            name: Windows / windows-2022 (x64)
          - os: windows-11-arm
            arch: arm64
            name: Windows / windows-11-arm (arm64)
          - os: macos-15-intel
            arch: x86_64
            name: macOS / macOS 15 Intel
          - os: macos-15
            arch: universal
            name: macOS / macOS 15 ARM Universal
    uses: ./.github/workflows/_build-cached.yml
    with:
      os: ${{ matrix.os }}
      arch: ${{ matrix.arch }}
      build-deps-only: false
    secrets: inherit

  # ── 3. Flatpak ────────────────────────────────────────────────────────────
  build_flatpak:
    name: Flatpak (x86_64)
    needs: [build_platforms]
    if: always() && needs.build_platforms.result != 'skipped'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411  # v2.19.4
        with:
          egress-policy: audit

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6

      - name: Download Ubuntu 24.04 AppImage from this run
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v4
        with:
          pattern: BambuStudio_ubuntu-24.04_amd64_*_appimage
          merge-multiple: true

      - name: Install Flatpak toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            flatpak flatpak-builder squashfs-tools desktop-file-utils appstream elfutils

      - name: Add Flathub remote
        run: |
          flatpak remote-add --user --if-not-exists flathub \
            https://dl.flathub.org/repo/flathub.flatpakrepo

      - name: Install Flatpak runtimes
        run: |
          flatpak install --user -y flathub \
            org.freedesktop.Platform//24.08 \
            org.freedesktop.Sdk//24.08

      - name: Extract AppImage
        run: |
          APPIMAGE=$(find . -maxdepth 1 -name "*.AppImage" | head -1)
          chmod +x "$APPIMAGE"
          "$APPIMAGE" --appimage-extract
          mv squashfs-root flatpak/squashfs-root

      - name: Inject version into Flatpak metainfo
        run: |
          ver=$(grep 'set(SLIC3R_VERSION_BASE' version.inc | cut -d '"' -f2)
          date=$(date -u +'%Y-%m-%d')
          sed -i "s|version=\"0\" date=\"1970-01-01\"|version=\"${ver}\" date=\"${date}\"|" \
            flatpak/com.bambulab.BambuStudio.metainfo.xml

      - name: Build Flatpak bundle
        run: |
          # flatpak-builder 1.4.2 + AppStream 1.0.2 incompatibility:
          # appstreamcli compose exits 1 on 'filters-but-no-output' and 'file-read-error'.
          # Both are fixed in flatpak-builder ≥1.4.6 / AppStream ≥1.0.6, but Ubuntu 24.04
          # ships the older versions. Wrap appstreamcli so compose never blocks the build.
          mkdir -p /tmp/asc-shim
          printf '#!/bin/sh\n/usr/bin/appstreamcli "$@" || true\n' \
            > /tmp/asc-shim/appstreamcli
          chmod +x /tmp/asc-shim/appstreamcli
          PATH="/tmp/asc-shim:$PATH" \
          flatpak-builder --user --force-clean \
            --repo=flatpak-repo --bundle-sources \
            flatpak-build flatpak/com.bambulab.BambuStudio.yaml

      - name: Export Flatpak bundle
        run: |
          flatpak build-bundle \
            --runtime-repo=https://dl.flathub.org/repo/flathub.flatpakrepo \
            flatpak-repo BambuStudio_rc.flatpak com.bambulab.BambuStudio

      - name: Upload Flatpak artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: BambuStudio_flatpak_rc_${{ github.ref_name }}
          path: BambuStudio_rc.flatpak
          retention-days: 30

  # ── 4. Publish RC release ─────────────────────────────────────────────────
  publish:
    name: Publish release candidate
    needs: [build_packages, build_platforms, build_flatpak]
    if: |
      always() &&
      needs.build_platforms.result != 'skipped' &&
      needs.build_flatpak.result != 'skipped'
    outputs:
      tag: ${{ steps.ver.outputs.tag }}
      published: ${{ steps.publish_rc.outputs.published }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411  # v2.19.4
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
        with:
          fetch-depth: 0

      - name: Compute RC version tag
        id: ver
        run: |
          base=$(grep 'set(SLIC3R_VERSION_BASE' version.inc | cut -d '"' -f2)
          sha=$(git rev-parse --short=7 HEAD)
          branch="${{ github.ref_name }}"
          # release/v02.07.00.55 → rc suffix from branch name
          rc_suffix=$(echo "$branch" | sed 's|release/||')
          echo "tag=${rc_suffix}-rc.${sha}" >> "$GITHUB_OUTPUT"
          echo "title=BambuStudio ${rc_suffix} RC (${sha})" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +'%Y-%m-%d %H:%M UTC')" >> "$GITHUB_OUTPUT"

      - name: Generate commit changelog
        run: |
          set -euo pipefail
          current_tag="${{ steps.ver.outputs.tag }}"
          # Base: last stable release tag (no nightly-*, no -rc.)
          prev_stable=$(git tag --list 'v*' --sort=-creatordate \
            | grep -v '\-rc\.' \
            | grep -v "^${current_tag}$" \
            | head -1 || true)
          if [[ -n "$prev_stable" ]]; then
            SINCE="since \`${prev_stable}\`"
            LOG=$(git log --oneline --no-merges "${prev_stable}..HEAD" 2>/dev/null | head -100 || true)
          else
            SINCE="(last 50 commits)"
            LOG=$(git log --oneline --no-merges -50 2>/dev/null || true)
          fi
          {
            printf '## Changes %s\n\n' "$SINCE"
            if [[ -n "$LOG" ]]; then
              echo "$LOG" | sed 's/^/- /'
            else
              printf '_No new commits_\n'
            fi
          } > /tmp/changelog.md
          cat /tmp/changelog.md

      - name: Import GPG signing key
        uses: ./.github/actions/setup-gpg
        with:
          signing-key: ${{ secrets.GIT_SIGNING_KEY }}
          signing-key-passphrase: ${{ secrets.GIT_SIGNING_KEY_PASSPHRASE }}
          signing-key-id: ${{ secrets.GIT_SIGNING_KEY_ID }}

      - name: Download all artifacts from this run
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v4
        with:
          path: artifacts/
          merge-multiple: true
        continue-on-error: true

      - name: Check artifact count
        id: check
        run: |
          n=$(find artifacts/ -maxdepth 1 -type f 2>/dev/null | wc -l)
          echo "n=$n" >> "$GITHUB_OUTPUT"
          echo "Found $n artifact(s):"
          find artifacts/ -maxdepth 1 -type f | sort || true

      - name: Generate checksums
        if: steps.check.outputs.n > 0
        run: |
          cd artifacts/
          find . -maxdepth 1 -type f ! -name 'SHA*SUMS' -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS
          find . -maxdepth 1 -type f ! -name 'SHA*SUMS' -print0 | sort -z | xargs -0 sha512sum > SHA512SUMS
          echo "=== SHA256SUMS ===" && cat SHA256SUMS
          echo "=== SHA512SUMS ===" && cat SHA512SUMS

      - name: Attest build provenance
        if: steps.check.outputs.n > 0
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32  # v4.1.0
        with:
          subject-path: artifacts/**

      - name: Create signed RC tag
        if: steps.check.outputs.n > 0
        run: |
          git tag -s "${{ steps.ver.outputs.tag }}" \
            -m "Release candidate ${{ steps.ver.outputs.date }}" \
            HEAD
          git push origin "${{ steps.ver.outputs.tag }}"

      - name: Publish RC pre-release
        id: publish_rc
        if: steps.check.outputs.n > 0
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mapfile -d '' FILES < <(find artifacts/ -maxdepth 1 -type f -print0 | sort -z)
          {
            printf 'Release Candidate built from branch `%s`, commit [`%s`](https://github.com/%s/commit/%s).\n\n' \
              "${{ github.ref_name }}" \
              "${GITHUB_SHA:0:7}" \
              "${{ github.repository }}" \
              "${{ github.sha }}"
            cat /tmp/changelog.md
          } > /tmp/release-notes.md
          gh release create "${{ steps.ver.outputs.tag }}" \
            --repo "${{ github.repository }}" \
            --title "${{ steps.ver.outputs.title }}" \
            --notes-file /tmp/release-notes.md \
            --prerelease \
            "${FILES[@]}"
          echo "published=true" >> "$GITHUB_OUTPUT"

  # ── 5. Post-publish smoke test (warning only, no rollback) ───────────────
  smoke_test:
    name: Smoke test .deb (RC)
    needs: [publish]
    if: needs.publish.result == 'success' && needs.publish.outputs.published == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    continue-on-error: true
    permissions:
      contents: read

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411  # v2.19.4
        with:
          egress-policy: audit

      - name: Download .deb from RC release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${{ needs.publish.outputs.tag }}"
          mkdir -p ./smoke/
          gh release download "$TAG" \
            --repo "${{ github.repository }}" \
            --pattern "bambustudio_*_amd64.deb" \
            --dir ./smoke/
          DEB=$(find ./smoke/ -name "*.deb" | head -1)
          if [[ -z "$DEB" ]]; then
            echo "::error::No bambustudio .deb found in release $TAG"
            exit 1
          fi
          echo "DEB=$DEB" >> "$GITHUB_ENV"

      - name: Verify .deb integrity
        run: |
          set -euo pipefail
          echo "=== Package info ==="
          dpkg-deb --info "$DEB"
          echo "=== Package contents ==="
          dpkg-deb --contents "$DEB" | tee /tmp/deb_contents.txt
          FILE_COUNT=$(wc -l < /tmp/deb_contents.txt)
          echo "Total files: $FILE_COUNT"
          if [[ "$FILE_COUNT" -lt 10 ]]; then
            echo "::error::.deb contains only $FILE_COUNT entries — package is likely corrupt (expected >=10)"
            exit 1
          fi

      - name: Install .deb
        run: |
          sudo apt-get install -f -y
          sudo dpkg -i "$DEB" || { sudo apt-get install -f -y && sudo dpkg -i "$DEB"; }

      - name: Verify binary present
        run: |
          if command -v bambustudio &>/dev/null; then
            echo "OK: $(which bambustudio)"
          elif [[ -f /usr/lib/bambustudio/bin/bambu-studio ]]; then
            echo "OK: /usr/lib/bambustudio/bin/bambu-studio"
            file /usr/lib/bambustudio/bin/bambu-studio
          else
            echo "::error::bambustudio binary not found after dpkg install"
            dpkg -L bambustudio 2>/dev/null | head -30 || true
            exit 1
          fi

      - name: Post warning on failure
        if: failure()
        run: |
          TAG="${{ needs.publish.outputs.tag }}"
          {
            echo "## ⚠️ RC Smoke Test Failed"
            echo ""
            echo "The post-publish smoke test failed for RC release \`${TAG}\`."
            echo "The release was **not** deleted — investigate the packaging issue before promoting to stable."
            echo ""
            echo "- Release: https://github.com/${{ github.repository }}/releases/tag/${TAG}"
            echo "- Run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          } >> "$GITHUB_STEP_SUMMARY"
