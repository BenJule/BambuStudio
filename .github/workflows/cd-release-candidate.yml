name: 'CD: Release Candidate'
run-name: "RC — ${{ github.ref_name }}"

on:
  push:
    branches:
      - 'release/**'
  workflow_dispatch: {}

permissions: read-all

concurrency:
  group: release-candidate-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  # ── 1. Distribution packages (Debian .deb, Fedora .rpm, self-hosted) ──────
  build_packages:
    name: Build distribution packages
    uses: ./.github/workflows/cd-packages.yml
    with:
      retention-days: 30
    secrets: inherit

  # ── 2. GitHub-hosted platforms — separate named jobs for independent re-runs
  rc_ubuntu_2204:
    name: Linux / Ubuntu 22.04
    needs: [build_packages]
    if: needs.build_packages.result != 'failure'
    uses: ./.github/workflows/_build-cached.yml
    with:
      os: ubuntu-22.04
      build-deps-only: false
    secrets: inherit

  rc_ubuntu_2404:
    name: Linux / Ubuntu 24.04
    needs: [build_packages]
    if: needs.build_packages.result != 'failure'
    uses: ./.github/workflows/_build-cached.yml
    with:
      os: ubuntu-24.04
      build-deps-only: false
    secrets: inherit

  rc_ubuntu_2404_arm:
    name: Linux / Ubuntu 24.04 ARM
    needs: [build_packages]
    if: needs.build_packages.result != 'failure'
    uses: ./.github/workflows/_build-cached.yml
    with:
      os: ubuntu-24.04-arm
      build-deps-only: false
    secrets: inherit

  rc_windows_x64:
    name: Windows / windows-2022 (x64)
    needs: [build_packages]
    if: needs.build_packages.result != 'failure'
    uses: ./.github/workflows/_build-cached.yml
    with:
      os: windows-2022
      arch: x64
      build-deps-only: false
    secrets: inherit

  rc_windows_arm:
    name: Windows / windows-11-arm (arm64)
    needs: [build_packages]
    if: needs.build_packages.result != 'failure'
    uses: ./.github/workflows/_build-cached.yml
    with:
      os: windows-11-arm
      arch: arm64
      build-deps-only: false
    secrets: inherit

  rc_macos_intel:
    name: macOS / macOS 15 Intel
    needs: [build_packages]
    if: needs.build_packages.result != 'failure'
    uses: ./.github/workflows/_build-cached.yml
    with:
      os: macos-15-intel
      arch: x86_64
      build-deps-only: false
    secrets: inherit

  rc_macos_15:
    name: macOS / macOS 15 ARM Universal
    needs: [build_packages]
    if: needs.build_packages.result != 'failure'
    uses: ./.github/workflows/_build-cached.yml
    with:
      os: macos-15
      arch: universal
      build-deps-only: false
    secrets: inherit

  rc_macos_26:
    name: macOS / macOS 26
    needs: [build_packages]
    if: needs.build_packages.result != 'failure'
    uses: ./.github/workflows/_build-cached.yml
    with:
      os: macos-26
      arch: universal
      build-deps-only: false
    secrets: inherit

  # ── 3. Flatpak ────────────────────────────────────────────────────────────
  build_flatpak:
    name: Flatpak (x86_64)
    needs: [rc_ubuntu_2204, rc_ubuntu_2404, rc_ubuntu_2404_arm, rc_windows_x64, rc_windows_arm, rc_macos_intel, rc_macos_15, rc_macos_26]
    if: always() && needs.rc_ubuntu_2404.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411  # v2.19.4
        with:
          egress-policy: audit

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6

      - name: Download Ubuntu 24.04 AppImage from this run
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v4
        with:
          pattern: BambuStudio_ubuntu-24.04_amd64_*_appimage
          merge-multiple: true

      - name: Install Flatpak toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            flatpak flatpak-builder squashfs-tools desktop-file-utils appstream elfutils

      - name: Add Flathub remote
        run: |
          flatpak remote-add --user --if-not-exists flathub \
            https://dl.flathub.org/repo/flathub.flatpakrepo

      - name: Install Flatpak runtimes
        run: |
          flatpak install --user -y flathub \
            org.freedesktop.Platform//24.08 \
            org.freedesktop.Sdk//24.08

      - name: Extract AppImage
        run: |
          APPIMAGE=$(find . -maxdepth 1 -name "*.AppImage" | head -1)
          chmod +x "$APPIMAGE"
          "$APPIMAGE" --appimage-extract
          mv squashfs-root flatpak/squashfs-root

      - name: Inject version into Flatpak metainfo
        run: |
          ver=$(grep 'set(SLIC3R_VERSION_BASE' version.inc | cut -d '"' -f2)
          date=$(date -u +'%Y-%m-%d')
          sed -i "s|version=\"0\" date=\"1970-01-01\"|version=\"${ver}\" date=\"${date}\"|" \
            flatpak/com.bambulab.BambuStudio.metainfo.xml

      - name: Build Flatpak bundle
        run: |
          # flatpak-builder 1.4.2 + AppStream 1.0.2 incompatibility:
          # appstreamcli compose exits 1 on 'filters-but-no-output' and 'file-read-error'.
          # Both are fixed in flatpak-builder ≥1.4.6 / AppStream ≥1.0.6, but Ubuntu 24.04
          # ships the older versions. Wrap appstreamcli so compose never blocks the build.
          mkdir -p /tmp/asc-shim
          printf '#!/bin/sh\n/usr/bin/appstreamcli "$@" || true\n' \
            > /tmp/asc-shim/appstreamcli
          chmod +x /tmp/asc-shim/appstreamcli
          PATH="/tmp/asc-shim:$PATH" \
          flatpak-builder --user --force-clean \
            --repo=flatpak-repo --bundle-sources \
            flatpak-build flatpak/com.bambulab.BambuStudio.yaml

      - name: Export Flatpak bundle
        run: |
          flatpak build-bundle \
            --runtime-repo=https://dl.flathub.org/repo/flathub.flatpakrepo \
            flatpak-repo BambuStudio_rc.flatpak com.bambulab.BambuStudio

      - name: Upload Flatpak artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: BambuStudio_flatpak_rc_${{ github.ref_name }}
          path: BambuStudio_rc.flatpak
          retention-days: 30

  # ── 4. Publish RC release ─────────────────────────────────────────────────
  publish:
    name: Publish release candidate
    needs: [build_packages, rc_ubuntu_2204, rc_ubuntu_2404, rc_ubuntu_2404_arm, rc_windows_x64, rc_windows_arm, rc_macos_intel, rc_macos_15, rc_macos_26, build_flatpak]
    if: |
      always() &&
      needs.build_packages.result != 'skipped' &&
      needs.build_flatpak.result != 'skipped'
    outputs:
      tag: ${{ steps.ver.outputs.tag }}
      published: ${{ steps.publish_rc.outputs.published }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411  # v2.19.4
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
        with:
          fetch-depth: 0

      - name: Compute RC version tag
        id: ver
        run: |
          base=$(grep 'set(SLIC3R_VERSION_BASE' version.inc | cut -d '"' -f2)
          sha=$(git rev-parse --short=7 HEAD)
          branch="${{ github.ref_name }}"
          # release/v02.07.00.55 → rc suffix from branch name
          rc_suffix=$(echo "$branch" | sed 's|release/||')
          echo "tag=${rc_suffix}-rc.${sha}" >> "$GITHUB_OUTPUT"
          echo "title=BambuStudio ${rc_suffix} RC (${sha})" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +'%Y-%m-%d %H:%M UTC')" >> "$GITHUB_OUTPUT"

      - name: Generate commit changelog
        run: |
          set -euo pipefail
          current_tag="${{ steps.ver.outputs.tag }}"
          # Base: last stable release tag (matches -bj.N or -dev, excludes -rc.)
          prev_stable=$(git tag --sort=-creatordate \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+-(bj\.[0-9]+|dev)$' \
            | grep -v "^${current_tag}$" \
            | head -1 || true)
          if [[ -n "$prev_stable" ]]; then
            SINCE="since \`${prev_stable}\`"
            LOG=$(git log --oneline --no-merges "${prev_stable}..HEAD" 2>/dev/null | head -100 || true)
          else
            SINCE="(last 50 commits)"
            LOG=$(git log --oneline --no-merges -50 2>/dev/null || true)
          fi
          {
            printf '## Changes %s\n\n' "$SINCE"
            if [[ -n "$LOG" ]]; then
              echo "$LOG" | sed 's/^/- /'
            else
              printf '_No new commits_\n'
            fi
          } > /tmp/changelog.md
          cat /tmp/changelog.md

      - name: Import GPG signing key
        uses: ./.github/actions/setup-gpg
        with:
          signing-key: ${{ secrets.GIT_SIGNING_KEY }}
          signing-key-passphrase: ${{ secrets.GIT_SIGNING_KEY_PASSPHRASE }}
          signing-key-id: ${{ secrets.GIT_SIGNING_KEY_ID }}

      - name: Download all artifacts from this run
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v4
        with:
          path: artifacts/
          merge-multiple: true
        continue-on-error: true

      - name: Drop internal build artifacts (deps) — not for end users
        run: |
          # The deps tarballs (BambuStudio_dep_*) are uploaded only for cross-job
          # sharing and smoke tests — they are not end-user assets and bloat the
          # release by ~800 MB. Keep them out of the published release.
          rm -f artifacts/BambuStudio_dep_* 2>/dev/null || true

      - name: Check artifact count
        id: check
        run: |
          n=$(find artifacts/ -maxdepth 1 -type f 2>/dev/null | wc -l)
          echo "n=$n" >> "$GITHUB_OUTPUT"
          echo "Found $n artifact(s):"
          find artifacts/ -maxdepth 1 -type f | sort || true

      - name: Generate SBOM
        if: steps.check.outputs.n > 0
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610  # v0.24.0
        with:
          path: artifacts/
          format: spdx-json
          output-file: artifacts/BambuStudio-${{ steps.ver.outputs.tag }}.sbom.spdx.json
          upload-artifact: false

      - name: Generate checksums
        if: steps.check.outputs.n > 0
        run: bash scripts/generate-checksums.sh artifacts/

      - name: Attest build provenance
        if: steps.check.outputs.n > 0
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32  # v4.1.0
        with:
          subject-path: artifacts/**

      - name: Create signed RC tag
        if: steps.check.outputs.n > 0
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.ver.outputs.tag }}"
          git tag -s "$TAG" -m "Release candidate ${{ steps.ver.outputs.date }}" HEAD
          # Push the signed tag directly — preserves the GPG signature. A tag push adds
          # no commits, so the workflow-file push protection does not apply. Fall back to
          # the two-step API (create the tag object first, then the ref) only if the
          # direct push is rejected — the ref API alone fails with 422 because the local
          # tag object is not on the server.
          if ! git push origin "refs/tags/${TAG}"; then
            echo "::warning::Direct signed-tag push rejected — creating tag via API (unsigned)"
            TAG_SHA=$(gh api repos/${{ github.repository }}/git/tags \
              -X POST -f tag="${TAG}" \
              -f message="Release candidate ${{ steps.ver.outputs.date }}" \
              -f object="$(git rev-parse 'HEAD^{commit}')" -f type=commit --jq .sha)
            gh api repos/${{ github.repository }}/git/refs \
              -X POST -f ref="refs/tags/${TAG}" -f sha="${TAG_SHA}"
          fi

      - name: Publish RC pre-release
        id: publish_rc
        if: steps.check.outputs.n > 0
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mapfile -d '' FILES < <(find artifacts/ -maxdepth 1 -type f -print0 | sort -z)
          {
            printf 'Release Candidate built from branch `%s`, commit [`%s`](https://github.com/%s/commit/%s).\n\n' \
              "${{ github.ref_name }}" \
              "${GITHUB_SHA:0:7}" \
              "${{ github.repository }}" \
              "${{ github.sha }}"
            cat /tmp/changelog.md
          } > /tmp/release-notes.md
          gh release create "${{ steps.ver.outputs.tag }}" \
            --repo "${{ github.repository }}" \
            --title "${{ steps.ver.outputs.title }}" \
            --notes-file /tmp/release-notes.md \
            --prerelease \
            --target "${{ github.sha }}" \
            "${FILES[@]}"
          echo "published=true" >> "$GITHUB_OUTPUT"

  # ── 5. Post-publish smoke test (warning only, no rollback) ───────────────
  smoke_test:
    name: Smoke test .deb (RC)
    needs: [publish]
    if: needs.publish.result == 'success' && needs.publish.outputs.published == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    continue-on-error: true
    permissions:
      contents: read

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411  # v2.19.4
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6

      - name: Download Debian .deb artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v4
        with:
          path: ./smoke/
          pattern: BambuStudio_debian-trixie_deb_*
          merge-multiple: true

      - name: Locate .deb
        run: |
          DEB=$(find ./smoke/ -name "*.deb" | head -1)
          if [ -z "$DEB" ]; then
            echo "::error::No .deb artifact found"
            exit 1
          fi
          echo "DEB=$DEB" >> "$GITHUB_ENV"

      - name: Run smoke test
        uses: ./.github/actions/smoke-test-deb
        with:
          deb-path: ${{ env.DEB }}

      - name: Post warning on failure
        if: failure()
        run: |
          TAG="${{ needs.publish.outputs.tag }}"
          {
            echo "## ⚠️ RC Smoke Test Failed"
            echo ""
            echo "The post-publish smoke test failed for RC release \`${TAG}\`."
            echo "The release was **not** deleted — investigate the packaging issue before promoting to stable."
            echo ""
            echo "- Release: https://github.com/${{ github.repository }}/releases/tag/${TAG}"
            echo "- Run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          } >> "$GITHUB_STEP_SUMMARY"
