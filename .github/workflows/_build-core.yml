name: '_: Build BambuStudio'

on:
  workflow_call:
    inputs:
      cache-key:
        required: true
        type: string
      cache-path:
        required: false
        type: string
      os:
        required: true
        type: string
      arch:
        required: false
        type: string

permissions: read-all

jobs:
  build_bambu:
    name: Build BambuStudio
    runs-on: ${{ inputs.os }}
    timeout-minutes: 360
    env:
      date: ""
      ver: ""
      ver_pure: ""

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411  # v2.19.4
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
        with:
          lfs: 'true'
          fetch-depth: 0

      - name: load cached deps
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5
        with:
          path: ${{ inputs.cache-path || format('{0}/deps/build', github.workspace) }}
          key: ${{ inputs.cache-key }}
          restore-keys: |
            bambu-deps-${{ inputs.os }}-${{ inputs.arch }}-
          fail-on-cache-miss: false

      - name: Get the version and date on Ubuntu and macOS
        if: runner.os != 'Windows'
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.number }}
        run: |
          set -euo pipefail
          ver_pure=$(grep 'set(SLIC3R_VERSION_BASE' version.inc | cut -d '"' -f2)
          count=$(git rev-list --count HEAD 2>/dev/null || echo "0")
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            ver="PR-${PR_NUMBER}"
          else
            ver="V${ver_pure}.${count}"
          fi
          echo "ver=$ver" >> "$GITHUB_ENV"
          echo "ver_pure=$ver_pure" >> "$GITHUB_ENV"
          echo "date=$(date +'%Y%m%d')" >> "$GITHUB_ENV"

      - name: Get the version and date on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.number }}
        run: |
          $date = Get-Date -Format 'yyyyMMdd'
          $count = (git rev-list --count HEAD 2>$null)
          if ($LASTEXITCODE -ne 0 -or -not $count) { $count = 0 }
          if ($env:EVENT_NAME -eq 'pull_request') {
              $ver = "PR-$env:PR_NUMBER"
          } else {
              $versionContent = Get-Content version.inc -Raw
              if ($versionContent -match 'set\(SLIC3R_VERSION_BASE "(.*?)"\)') {
                  $ver = "V$($matches[1]).$count"
              } else {
                  $ver = "Vunknown"
              }
          }
          "ver=$ver" | Out-File -Append -FilePath $env:GITHUB_ENV -Encoding utf8
          "date=$date" | Out-File -Append -FilePath $env:GITHUB_ENV -Encoding utf8
          Write-Host "date: $date version: $ver"

# ── macOS ───────────────────────────────────────────────────────────────────
      - name: Install cmake 3.31.x (macOS)
        if: runner.os == 'macOS'
        uses: lukka/get-cmake@591817e96fcad43505fb4eae36172462abb3a42e  # v4.3.3
        with:
          cmakeVersion: "~3.31.0"
          useLocalCache: true
          useCloudCache: true

      - name: Cache Homebrew downloads (macOS)
        if: runner.os == 'macOS'
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5
        with:
          path: ~/Library/Caches/Homebrew/downloads
          key: brew-core-${{ inputs.os }}-${{ hashFiles('.github/workflows/_build-core.yml') }}
          restore-keys: |
            brew-core-${{ inputs.os }}-

      - name: Restore ccache (macOS)
        if: runner.os == 'macOS'
        id: ccache-restore
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5
        with:
          path: ~/.ccache
          key: ccache-${{ inputs.os }}-${{ inputs.arch }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ inputs.os }}-${{ inputs.arch }}-

      - name: Build slicer mac (Intel x86_64)
        if: runner.os == 'macOS' && inputs.arch == 'x86_64'
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          brew install automake texinfo nasm yasm ccache zstd
          export CCACHE_SLOPPINESS="pch_defines,time_macros"
          export CCACHE_IGNOREOPTIONSREGEX="-DSLIC3R_DEV_TIMESTAMP=.*"
          ccache --zero-stats
          if [ ! -d "${{ github.workspace }}/deps/build/x86_64" ]; then
            echo "No macOS Intel cache found. Building deps + slicer..."
            ./BuildMac.sh -x -a x86_64 -t 10.15
          else
            echo "Using cached deps..."
            ./BuildMac.sh -s -x -a x86_64 -t 10.15
          fi

      - name: Build slicer mac (ARM / Universal)
        if: runner.os == 'macOS' && inputs.arch != 'x86_64'
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          brew install automake texinfo nasm yasm ccache zstd
          export CCACHE_SLOPPINESS="pch_defines,time_macros"
          export CCACHE_IGNOREOPTIONSREGEX="-DSLIC3R_DEV_TIMESTAMP=.*"
          ccache --zero-stats
          if [ ! -d "${{ github.workspace }}/deps/build/arm64" ]; then
            echo "No macOS ARM cache found. Building deps + slicer..."
            ./BuildMac.sh -x -a universal -t 10.15 -1
          else
            echo "Using cached deps..."
            ./BuildMac.sh -s -x -a universal -t 10.15 -1
          fi

      - name: Save ccache (macOS)
        if: always() && runner.os == 'macOS'
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5
        with:
          path: ~/.ccache
          key: ccache-${{ inputs.os }}-${{ inputs.arch }}-${{ github.sha }}

      - name: ccache statistics (macOS)
        if: always() && runner.os == 'macOS'
        run: |
          echo "### ccache statistics (macOS ${{ inputs.os }} ${{ inputs.arch }})" >> "$GITHUB_STEP_SUMMARY"
          ccache --show-stats --verbose | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Pack macOS .dmg
        if: runner.os == 'macOS'
        working-directory: ${{ github.workspace }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ inputs.arch }}" == "x86_64" ]]; then
            APP_PATH="${{ github.workspace }}/build/x86_64/BambuStudio/BambuStudio.app"
          else
            APP_PATH="${{ github.workspace }}/build/universal/BambuStudio/BambuStudio.app"
          fi
          DMG_NAME="BambuStudio_${{ inputs.os }}_${{ inputs.arch }}_${{ env.ver }}.dmg"
          STAGING=$(mktemp -d)
          cleanup() { rm -rf "$STAGING"; }
          trap cleanup EXIT
          cp -R "$APP_PATH" "$STAGING/BambuStudio.app"
          ln -s /Applications "$STAGING/Applications"
          hdiutil create \
            -srcfolder "$STAGING" \
            -format UDZO \
            -volname "BambuStudio ${{ env.ver }}" \
            -o "${{ github.workspace }}/$DMG_NAME"

      - name: Upload artifacts mac
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: BambuStudio_${{ inputs.os }}_${{ inputs.arch }}_${{ env.ver }}_dmg
          path: ${{ github.workspace }}/BambuStudio_${{ inputs.os }}_${{ inputs.arch }}_${{ env.ver }}.dmg

# ── Windows ─────────────────────────────────────────────────────────────────
      - name: Install cmake 3.31.x (Windows)
        if: runner.os == 'Windows'
        uses: lukka/get-cmake@591817e96fcad43505fb4eae36172462abb3a42e  # v4.3.3
        with:
          cmakeVersion: "~3.31.0"
          useLocalCache: true
          useCloudCache: true

      - name: Install sccache (Windows x64)
        if: runner.os == 'Windows' && inputs.arch != 'arm64'
        uses: mozilla-actions/sccache-action@1583d6b38d7be47f593cb472781bbb21cab4321e  # v0.0.10

      - name: setup MSVC
        if: runner.os == 'Windows'
        uses: microsoft/setup-msbuild@30375c66a4eea26614e0d39710365f22f8b0af57  # v3

      - name: Setup MSVC developer environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756  # v1.13.0
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
        with:
          arch: ${{ inputs.arch == 'arm64' && 'amd64_arm64' || 'amd64' }}

      - name: Install nsis and pkgconfig
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install nsis --version=3.10.0 -y --no-progress
          # MSYS2 is pre-installed at C:\msys64 on windows-2022 runners;
          # windows-11-arm runners don't have it — install via Chocolatey (lands in C:\tools\msys64).
          $msys2Root = "C:\msys64"
          if (-not (Test-Path "$msys2Root\usr\bin\pacman.exe")) {
            $msys2Root = "C:\tools\msys64"
            if (-not (Test-Path "$msys2Root\usr\bin\pacman.exe")) {
              # Retry up to 3 times — Chocolatey community feed occasionally returns 504
              $installed = $false
              for ($attempt = 1; $attempt -le 3; $attempt++) {
                Write-Host "Installing MSYS2 via Chocolatey (attempt $attempt/3)..."
                choco install msys2 -y --no-progress
                if (Test-Path "$msys2Root\usr\bin\pacman.exe") { $installed = $true; break }
                if ($attempt -lt 3) { Start-Sleep -Seconds 30 }
              }
              if (-not $installed) { throw "Failed to install MSYS2 after 3 attempts (Chocolatey feed unavailable)" }
            }
          }
          & "$msys2Root\usr\bin\pacman.exe" -S --noconfirm mingw-w64-x86_64-pkgconf
          if ($LASTEXITCODE -ne 0) { throw "pacman failed to install mingw-w64-x86_64-pkgconf (exit $LASTEXITCODE)" }
          $env:PATH = "$msys2Root\mingw64\bin;$env:PATH"
          Add-Content $env:GITHUB_PATH "$msys2Root\mingw64\bin"

      - name: Build slicer Win
        if: runner.os == 'Windows'
        working-directory: ${{ github.workspace }}
        shell: pwsh
        env:
          INPUT_ARCH: ${{ inputs.arch }}
          SCCACHE_GHA_ENABLED: "true"
        run: |
          $vsArch  = if ($env:INPUT_ARCH -eq "arm64") { "ARM64" } else { "X64" }
          $depPath = "$env:GITHUB_WORKSPACE\deps\build\BambuStudio_dep"
          if (!(Test-Path $depPath)) {
              Write-Host "No Windows cache found. Building third-party deps first..."
              choco install strawberryperl -y --no-progress
              $msys2Root = if (Test-Path "C:\msys64\usr\bin\pacman.exe") { "C:\msys64" } else { "C:\tools\msys64" }
              & "$msys2Root\usr\bin\pacman.exe" -S --noconfirm mingw-w64-x86_64-pkgconf
              if ($LASTEXITCODE -ne 0) { throw "pacman failed to install mingw-w64-x86_64-pkgconf (exit $LASTEXITCODE)" }
              $env:PATH = "$msys2Root\mingw64\bin;$env:PATH"
              Add-Content $env:GITHUB_PATH "$msys2Root\mingw64\bin"
              New-Item -ItemType Directory -Force -Path "$env:GITHUB_WORKSPACE\deps\build\BambuStudio_dep" | Out-Null
              Push-Location "$env:GITHUB_WORKSPACE\deps\build"
              cmake ../ -G "Visual Studio 17 2022" -A $vsArch -DDESTDIR="./BambuStudio_dep" -DCMAKE_BUILD_TYPE=Release -DDEP_DEBUG=OFF
              msbuild /m ALL_BUILD.vcxproj
              Pop-Location
          }
          New-Item -ItemType Directory -Force -Path build | Out-Null
          Push-Location build
          if ($env:INPUT_ARCH -eq "arm64") {
            # OpenCVConfig.cmake reads CMAKE_GENERATOR_PLATFORM to detect arch.
            # Ninja does not set that variable, causing OpenCV_FOUND=FALSE on ARM64.
            # VS generator sets CMAKE_GENERATOR_PLATFORM=ARM64 so OpenCV resolves correctly.
            cmake .. -G "Visual Studio 17 2022" -A ARM64 `
              -DBBL_RELEASE_TO_PUBLIC=1 -DBBL_INTERNAL_TESTING=0 `
              -DCMAKE_PREFIX_PATH="$depPath\usr\local" `
              -DCMAKE_INSTALL_PREFIX="../install-dir"
            cmake --build . --config Release --target install --parallel
          } else {
            # Verify sccache server is responsive before using it as a compiler launcher.
            # GHA cache backend can time out on startup; fall back to direct compilation
            # to avoid breaking the build when sccache is unavailable.
            $sccacheFlags = @()
            try {
              sccache --show-stats 2>&1 | Out-Null
              if ($LASTEXITCODE -eq 0) {
                $sccacheFlags = @(
                  "-DCMAKE_C_COMPILER_LAUNCHER=sccache",
                  "-DCMAKE_CXX_COMPILER_LAUNCHER=sccache"
                )
                Write-Host "sccache available — compiler cache enabled"
              } else {
                Write-Host "sccache unresponsive (exit $LASTEXITCODE) — building without cache"
              }
            } catch {
              Write-Host "sccache not found — building without cache"
            }
            cmake .. -G Ninja `
              -DCMAKE_C_COMPILER=cl.exe `
              -DCMAKE_CXX_COMPILER=cl.exe `
              @sccacheFlags `
              "-DCMAKE_CXX_FLAGS_RELEASE=/MD /O2 /Ob2 /DNDEBUG /Z7" `
              "-DCMAKE_C_FLAGS_RELEASE=/MD /O2 /Ob2 /DNDEBUG /Z7" `
              -DBBL_RELEASE_TO_PUBLIC=1 -DBBL_INTERNAL_TESTING=0 `
              "-DCMAKE_PREFIX_PATH=$depPath\usr\local" `
              -DCMAKE_INSTALL_PREFIX="../install-dir" `
              -DCMAKE_BUILD_TYPE=Release
            cmake --build . --target install
          }
          Pop-Location

      - name: Pack app Win
        if: runner.os == 'Windows'
        working-directory: ${{ github.workspace }}
        shell: cmd
        run: '"C:/Program Files/7-Zip/7z.exe" a -tzip BambuStudio_windows_${{ inputs.arch || ''x64'' }}_${{ env.ver }}_portable.zip ${{ github.workspace }}/install-dir'

      - name: Upload artifacts Win zip
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: BambuStudio_windows_${{ inputs.arch || 'x64' }}_${{ env.ver }}_portable
          path: ${{ github.workspace }}/BambuStudio_windows_${{ inputs.arch || 'x64' }}_${{ env.ver }}_portable.zip

# ── Ubuntu / Linux ──────────────────────────────────────────────────────────
      - name: Install dependencies from BuildLinux.sh
        if: runner.os == 'Linux'
        shell: bash
        run: sudo ./BuildLinux.sh -ur

      - name: Fix permissions
        if: runner.os == 'Linux'
        shell: bash
        run: sudo chown $USER -R ./

      - name: Set Linux arch label
        if: runner.os == 'Linux'
        shell: bash
        run: |
          if [[ "$(uname -m)" == "aarch64" ]]; then
            echo "linux_arch=arm64" >> "$GITHUB_ENV"
          else
            echo "linux_arch=amd64" >> "$GITHUB_ENV"
          fi
          os_label="${{ inputs.os }}"
          echo "os_label=${os_label%-arm}" >> "$GITHUB_ENV"

      - name: Restore ccache (Linux)
        if: runner.os == 'Linux'
        id: ccache-restore-linux
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5
        with:
          path: ~/.ccache
          key: ccache-${{ inputs.os }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ inputs.os }}-

      - name: Build slicer Linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get install -y --no-install-recommends ccache
          export PATH="/usr/lib/ccache:$PATH"
          export CCACHE_DIR="$HOME/.ccache"
          export CCACHE_MAXSIZE="5G"
          export CCACHE_SLOPPINESS="pch_defines,time_macros"
          export CCACHE_IGNOREOPTIONSREGEX="-DSLIC3R_DEV_TIMESTAMP=.*"
          ccache --zero-stats
          if [ ! -d "${{ github.workspace }}/deps/build/destdir" ]; then
            echo "No Linux cache found. Building deps + slicer..."
            ./BuildLinux.sh -idfr
          fi
          ./BuildLinux.sh -isfr
          mv -n ./build/BambuStudio_ubu64.AppImage ./build/BambuStudio_${{ env.os_label }}_${{ env.linux_arch }}_${{ env.ver }}.AppImage

      - name: Save ccache (Linux)
        if: runner.os == 'Linux'
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5
        with:
          path: ~/.ccache
          key: ccache-${{ inputs.os }}-${{ github.sha }}

      - name: ccache statistics (Linux)
        if: always() && runner.os == 'Linux'
        run: |
          export CCACHE_DIR="$HOME/.ccache"
          echo "### ccache statistics (${{ inputs.os }})" >> "$GITHUB_STEP_SUMMARY"
          ccache --show-stats --verbose | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload artifacts Ubuntu AppImage
        if: ${{ ! env.ACT && runner.os == 'Linux' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: BambuStudio_${{ env.os_label }}_${{ env.linux_arch }}_${{ env.ver }}_appimage
          path: './build/BambuStudio_${{ env.os_label }}_${{ env.linux_arch }}_${{ env.ver }}.AppImage'


