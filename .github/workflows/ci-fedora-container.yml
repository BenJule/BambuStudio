name: 'CI: Build Fedora container'
run-name: "Build fedora image — ${{ github.ref_name }}"

on:
  schedule:
    - cron: '0 3 * * 1'  # weekly Monday 03:00 UTC — tracks upstream fedora:42 updates
  push:
    paths:
      - 'docker/Dockerfile.fedora'
      - '.github/workflows/ci-fedora-container.yml'
  workflow_dispatch:

permissions: read-all

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and push fedora image
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920  # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c  # v4.2.0

      - name: Log in to ghcr.io
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0  # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set lowercase owner
        run: echo "IMAGE_OWNER=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7.3.0
        with:
          context: docker
          file: docker/Dockerfile.fedora
          push: true
          # No build attestation — avoids the extra "unknown/unknown" manifest
          # entry GHCR shows for the provenance attestation.
          provenance: false
          tags: |
            ghcr.io/${{ env.IMAGE_OWNER }}/bambu-fedora:42
            ghcr.io/${{ env.IMAGE_OWNER }}/bambu-fedora:latest
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ github.event.head_commit.timestamp }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
