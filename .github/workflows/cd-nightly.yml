name: 'CD: Nightly Pre-Release'
run-name: "Nightly #${{ github.run_number }}"

on:
  schedule:
    - cron: '0 22 * * *'  # 22:00 UTC every night
  push:
    branches: [develop]
  workflow_dispatch: {}   # manual trigger

permissions: read-all

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── 0. Detect whether anything changed since the last nightly ───────────────
  detect_changes:
    name: Detect changes since last nightly
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      cpp: ${{ steps.check.outputs.cpp }}
      has_changes: ${{ steps.check.outputs.has_changes }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c  # v2.21.0
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            github.com:443

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
      - name: Check for changes since last nightly
        id: check
        run: |
          # Manual trigger always builds
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
            echo "cpp=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # For scheduled/push: skip if no commits since last nightly tag
          last_nightly=$(git tag --sort=-version:refname \
            | grep '^nightly-' | head -1 || echo "")
          if [[ -z "$last_nightly" ]]; then
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          elif [[ $(git rev-list "${last_nightly}..HEAD" --count) -eq 0 ]]; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo "## ⏭️ Nightly skipped — no changes since \`${last_nightly}\`" >> "$GITHUB_STEP_SUMMARY"
            echo "No new commits between \`${last_nightly}\` and HEAD." \
              "Build will run again tomorrow or when new commits land." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi

          # C++ change detection (only relevant on push trigger)
          if [[ "${{ github.event_name }}" != "push" ]]; then
            echo "cpp=true" >> "$GITHUB_OUTPUT"
          elif git diff --name-only HEAD~1 HEAD \
              | grep -qE '\.(cpp|h|hpp|mm|c)$|CMakeLists\.txt|version\.inc'; then
            echo "cpp=true" >> "$GITHUB_OUTPUT"
          else
            echo "cpp=false" >> "$GITHUB_OUTPUT"
          fi

  # ── 1. Distribution packages (Debian .deb, Fedora .rpm, self-hosted) ──────
  build_packages:
    name: Build distribution packages
    needs: [detect_changes]
    if: needs.detect_changes.outputs.has_changes == 'true'
    uses: ./.github/workflows/cd-packages.yml
    with:
      retention-days: 3
    secrets: inherit

  # ── 2a. Fast platforms: Linux + Windows ───────────────────────────────────
  build_ubuntu_2204:
    name: Linux / Ubuntu 22.04
    needs: [detect_changes, build_packages]
    if: needs.detect_changes.outputs.has_changes == 'true' && needs.build_packages.result != 'failure'
    uses: ./.github/workflows/_build-cached.yml
    with:
      os: ubuntu-22.04
      build-deps-only: false
    secrets: inherit

  build_ubuntu_2404:
    name: Linux / Ubuntu 24.04
    needs: [detect_changes, build_packages]
    if: needs.detect_changes.outputs.has_changes == 'true' && needs.build_packages.result != 'failure'
    uses: ./.github/workflows/_build-cached.yml
    with:
      os: ubuntu-24.04
      build-deps-only: false
    secrets: inherit

  build_ubuntu_2404_arm:
    name: Linux / Ubuntu 24.04 ARM
    needs: [detect_changes, build_packages]
    if: needs.detect_changes.outputs.has_changes == 'true' && needs.build_packages.result != 'failure'
    uses: ./.github/workflows/_build-cached.yml
    with:
      os: ubuntu-24.04-arm
      build-deps-only: false
    secrets: inherit

  build_windows_x64:
    name: Windows / windows-2022 (x64)
    needs: [detect_changes, build_packages]
    if: needs.detect_changes.outputs.has_changes == 'true' && needs.build_packages.result != 'failure'
    uses: ./.github/workflows/_build-cached.yml
    with:
      os: windows-2022
      arch: x64
      build-deps-only: false
    secrets: inherit

  build_windows_arm:
    name: Windows / windows-11-arm (arm64)
    needs: [detect_changes, build_packages]
    if: needs.detect_changes.outputs.has_changes == 'true' && needs.build_packages.result != 'failure'
    uses: ./.github/workflows/_build-cached.yml
    with:
      os: windows-11-arm
      arch: arm64
      build-deps-only: false
    secrets: inherit

  # ── 2b. Slow platforms: macOS (skipped on push with no C++ changes) ────────
  build_macos_intel:
    name: macOS / macOS 15 Intel
    needs: [detect_changes, build_packages]
    if: needs.detect_changes.outputs.has_changes == 'true' && needs.build_packages.result != 'failure' && needs.detect_changes.outputs.cpp == 'true'
    uses: ./.github/workflows/_build-cached.yml
    with:
      os: macos-15-intel
      arch: x86_64
      build-deps-only: false
    secrets: inherit

  build_macos_15:
    name: macOS / macOS 15 ARM Universal
    needs: [detect_changes, build_packages]
    if: needs.detect_changes.outputs.has_changes == 'true' && needs.build_packages.result != 'failure' && needs.detect_changes.outputs.cpp == 'true'
    uses: ./.github/workflows/_build-cached.yml
    with:
      os: macos-15
      arch: universal
      build-deps-only: false
    secrets: inherit

  build_macos_26:
    name: macOS / macOS 26
    needs: [detect_changes, build_packages]
    if: needs.detect_changes.outputs.has_changes == 'true' && needs.build_packages.result != 'failure' && needs.detect_changes.outputs.cpp == 'true'
    uses: ./.github/workflows/_build-cached.yml
    with:
      os: macos-26
      arch: universal
      build-deps-only: false
    secrets: inherit

  # ── 3. Flatpak — built from the Ubuntu 24.04 AppImage of this same run ─────
  build_flatpak:
    name: Flatpak (x86_64)
    needs: [build_ubuntu_2204, build_ubuntu_2404, build_ubuntu_2404_arm, build_windows_x64, build_windows_arm]
    if: always() && needs.build_ubuntu_2404.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c  # v2.21.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Download Ubuntu 24.04 AppImage from this run
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v4
        with:
          pattern: BambuStudio_ubuntu-24.04_amd64_*_appimage
          merge-multiple: true

      - name: Install Flatpak toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            flatpak flatpak-builder squashfs-tools desktop-file-utils appstream elfutils

      - name: Add Flathub remote
        run: |
          flatpak remote-add --user --if-not-exists flathub \
            https://dl.flathub.org/repo/flathub.flatpakrepo

      - name: Install Flatpak runtimes
        run: |
          flatpak install --user -y flathub \
            org.freedesktop.Platform//24.08 \
            org.freedesktop.Sdk//24.08

      - name: Extract AppImage
        run: |
          APPIMAGE=$(find . -maxdepth 1 -name "*.AppImage" | head -1)
          chmod +x "$APPIMAGE"
          "$APPIMAGE" --appimage-extract
          mv squashfs-root flatpak/squashfs-root

      - name: Inject version into Flatpak metainfo
        run: |
          ver=$(grep 'set(SLIC3R_VERSION_BASE' version.inc | cut -d '"' -f2)
          date=$(date -u +'%Y-%m-%d')
          sed -i "s|version=\"0\" date=\"1970-01-01\"|version=\"${ver}\" date=\"${date}\"|" \
            flatpak/com.bambulab.BambuStudio.metainfo.xml

      - name: Build Flatpak bundle
        run: |
          # flatpak-builder 1.4.2 + AppStream 1.0.2 incompatibility:
          # appstreamcli compose exits 1 on 'filters-but-no-output' and 'file-read-error'.
          # Both are fixed in flatpak-builder ≥1.4.6 / AppStream ≥1.0.6, but Ubuntu 24.04
          # ships the older versions. Wrap appstreamcli so compose never blocks the build.
          mkdir -p /tmp/asc-shim
          printf '#!/bin/sh\n/usr/bin/appstreamcli "$@" || true\n' \
            > /tmp/asc-shim/appstreamcli
          chmod +x /tmp/asc-shim/appstreamcli
          PATH="/tmp/asc-shim:$PATH" \
          flatpak-builder --user --force-clean \
            --repo=flatpak-repo --bundle-sources \
            flatpak-build flatpak/com.bambulab.BambuStudio.yaml

      - name: Export Flatpak bundle
        run: |
          set -euo pipefail
          ver=$(grep -m1 'set(SLIC3R_VERSION_BASE' version.inc | cut -d '"' -f2 || true)
          : "${ver:?Failed to parse SLIC3R_VERSION_BASE from version.inc}"
          sha=$(git rev-parse --short=7 HEAD)
          FLATPAK_NAME="BambuStudio_linux_amd64_${ver}-dev.$(date -u +%Y%m%d)+git.${sha}.flatpak"
          echo "FLATPAK_NAME=${FLATPAK_NAME}" >> "$GITHUB_ENV"
          flatpak build-bundle \
            --runtime-repo=https://dl.flathub.org/repo/flathub.flatpakrepo \
            flatpak-repo "${FLATPAK_NAME}" com.bambulab.BambuStudio

      - name: Upload Flatpak artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: BambuStudio_linux_amd64_flatpak_nightly
          path: ${{ env.FLATPAK_NAME }}
          retention-days: 3

  # ── 4. Publish — after all builds, requires at least one artifact ─────────
  publish:
    name: Publish nightly pre-release
    needs: [build_packages, build_ubuntu_2204, build_ubuntu_2404, build_ubuntu_2404_arm, build_windows_x64, build_windows_arm, build_macos_intel, build_macos_15, build_macos_26, build_flatpak]
    if: |
      always() &&
      needs.build_ubuntu_2404.result != 'skipped' &&
      needs.build_flatpak.result != 'skipped'
    outputs:
      tag: ${{ steps.ver.outputs.tag }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c  # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - name: Compute version tag
        id: ver
        run: |
          base=$(grep 'set(SLIC3R_VERSION_BASE' version.inc | cut -d '"' -f2)
          sha=$(git rev-parse --short=7 HEAD)
          date_tag=$(date -u +'%Y%m%d')
          date_human=$(date -u +'%Y-%m-%d %H:%M UTC')
          echo "tag=nightly-${date_tag}-${sha}" >> "$GITHUB_OUTPUT"
          echo "title=BambuStudio Nightly ${base}-dev.${date_tag}+git.${sha}" >> "$GITHUB_OUTPUT"
          echo "date=${date_human}" >> "$GITHUB_OUTPUT"

      - name: Generate commit changelog
        run: |
          set -euo pipefail
          current_tag="${{ steps.ver.outputs.tag }}"
          last_nightly=$(git tag --list 'nightly-*' --sort=-creatordate \
            | grep -v "^${current_tag}$" \
            | head -1 || true)
          if [[ -n "$last_nightly" ]]; then
            SINCE="since \`${last_nightly}\`"
            LOG=$(git log --oneline --no-merges "${last_nightly}..HEAD" 2>/dev/null | head -50 || true)
          else
            SINCE="(last 30 commits)"
            LOG=$(git log --oneline --no-merges -30 2>/dev/null || true)
          fi
          {
            printf '## Changes %s\n\n' "$SINCE"
            if [[ -n "$LOG" ]]; then
              echo "$LOG" | sed 's/^/- /'
            else
              printf '_No new commits_\n'
            fi
          } > /tmp/changelog.md
          cat /tmp/changelog.md

      - name: Import GPG signing key
        uses: ./.github/actions/setup-gpg
        with:
          signing-key: ${{ secrets.GIT_SIGNING_KEY }}
          signing-key-passphrase: ${{ secrets.GIT_SIGNING_KEY_PASSPHRASE }}
          signing-key-id: ${{ secrets.GIT_SIGNING_KEY_ID }}

      - name: Download all artifacts from this run
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v4
        with:
          path: artifacts/
          merge-multiple: true
        continue-on-error: true

      - name: Drop internal build artifacts (deps) — not for end users
        run: |
          # The deps tarballs (BambuStudio_dep_*) are uploaded only for cross-job
          # sharing and smoke tests — they are not end-user assets and bloat the
          # release by ~800 MB. Keep them out of the published release.
          rm -f artifacts/BambuStudio_dep_* 2>/dev/null || true

      - name: Check artifact count
        id: check
        run: |
          n=$(find artifacts/ -maxdepth 1 -type f 2>/dev/null | wc -l)
          echo "n=$n" >> "$GITHUB_OUTPUT"
          echo "Found $n artifact(s):"
          find artifacts/ -maxdepth 1 -type f | sort || true

      - name: Generate SBOM
        if: steps.check.outputs.n > 0
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26  # v0.24.2
        with:
          path: artifacts/
          format: spdx-json
          output-file: artifacts/BambuStudio-${{ steps.ver.outputs.tag }}.sbom.spdx.json
          upload-artifact: false

      - name: Generate checksums
        if: steps.check.outputs.n > 0
        run: bash scripts/generate-checksums.sh artifacts/

      - name: Attest build provenance
        if: steps.check.outputs.n > 0
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-path: artifacts/**

      - name: Create signed nightly tag
        if: steps.check.outputs.n > 0
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.ver.outputs.tag }}"
          # Rerun-safe: a re-run of a partial Publish would otherwise abort with
          # "fatal: tag already exists" (exit 128), because git fetch pulls the tag
          # the earlier run created. Drop any stale local tag before recreating it;
          # the build commit is identical on a re-run.
          git tag -d "$TAG" 2>/dev/null || true
          git tag -s "$TAG" -m "Nightly build ${{ steps.ver.outputs.date }}" HEAD
          # Push the signed tag directly — preserves the GPG signature. A tag push adds
          # no commits (HEAD is already on the remote), so the workflow-file push
          # protection does not apply. --force lets a re-run update an existing ref.
          # Fall back to the two-step API (create the tag object first, then the ref)
          # only if the direct push is rejected — the ref API alone fails with 422
          # because the local tag object is not on the server.
          if ! git push --force "https://x-access-token:${{ secrets.WORKFLOW_PAT }}@github.com/${GITHUB_REPOSITORY}" "refs/tags/${TAG}"; then
            echo "::warning::Direct signed-tag push rejected — creating tag via API (unsigned)"
            TAG_SHA=$(gh api repos/${{ github.repository }}/git/tags \
              -X POST -f tag="${TAG}" \
              -f message="Nightly build ${{ steps.ver.outputs.date }}" \
              -f object="$(git rev-parse 'HEAD^{commit}')" -f type=commit --jq .sha)
            gh api repos/${{ github.repository }}/git/refs \
              -X POST -f ref="refs/tags/${TAG}" -f sha="${TAG_SHA}" \
              || gh api repos/${{ github.repository }}/git/refs/tags/"${TAG}" \
                -X PATCH -f sha="${TAG_SHA}" -F force=true
          fi

      - name: Cleanup old nightly releases (keep last 14)
        if: steps.check.outputs.n > 0
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release list --repo "${{ github.repository }}" \
            --limit 200 --json tagName,createdAt,isPrerelease \
            --jq '[.[] | select(.isPrerelease and (.tagName | startswith("nightly-")))]
                  | sort_by(.createdAt) | reverse | .[14:] | .[].tagName' \
          | while read -r old_tag; do
              echo "Deleting old nightly release: $old_tag"
              gh release delete "$old_tag" --repo "${{ github.repository }}" --yes --cleanup-tag || true
            done

      - name: Build status summary
        id: summary
        if: steps.check.outputs.n > 0
        run: |
          parts=()
          [[ "${{ needs.build_packages.result }}" == "success" ]] \
            && parts+=("Distribution packages ✅") \
            || parts+=("Distribution packages ⚠️ ${{ needs.build_packages.result }}")

          # Fast builds: all must succeed
          fast_results=(
            "${{ needs.build_ubuntu_2204.result }}"
            "${{ needs.build_ubuntu_2404.result }}"
            "${{ needs.build_ubuntu_2404_arm.result }}"
            "${{ needs.build_windows_x64.result }}"
            "${{ needs.build_windows_arm.result }}"
          )
          fast_ok=true
          for r in "${fast_results[@]}"; do [[ "$r" != "success" ]] && fast_ok=false; done
          $fast_ok && parts+=("Linux/Windows ✅") \
            || parts+=("Linux/Windows ⚠️ (check individual jobs)")

          # macOS: may be skipped on non-C++ push
          mac_26="${{ needs.build_macos_26.result }}"
          mac_15="${{ needs.build_macos_15.result }}"
          mac_intel="${{ needs.build_macos_intel.result }}"
          if [[ "$mac_26" == "skipped" && "$mac_15" == "skipped" && "$mac_intel" == "skipped" ]]; then
            parts+=("macOS ⏭️ skipped (no C++ changes)")
          elif [[ "$mac_26" == "success" && "$mac_15" == "success" && "$mac_intel" == "success" ]]; then
            parts+=("macOS ✅")
          else
            parts+=("macOS ⚠️ (check individual jobs)")
          fi

          printf '%s\n' "${parts[@]}" > /tmp/status.txt
          echo "notes<<EOF" >> "$GITHUB_OUTPUT"
          cat /tmp/status.txt >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Publish nightly pre-release
        if: steps.check.outputs.n > 0
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mapfile -d '' FILES < <(find artifacts/ -maxdepth 1 -type f -print0 | sort -z)
          {
            printf 'Automatic nightly build from commit [`%s`](https://github.com/%s/commit/%s).\n\n' \
              "${GITHUB_SHA:0:7}" \
              "${{ github.repository }}" \
              "${{ github.sha }}"
            cat /tmp/changelog.md
            printf '\n## Build status\n\n%s\n' "${{ steps.summary.outputs.notes }}"
          } > /tmp/release-notes.md
          gh release create "${{ steps.ver.outputs.tag }}" \
            --repo "${{ github.repository }}" \
            --title "${{ steps.ver.outputs.title }}" \
            --notes-file /tmp/release-notes.md \
            --prerelease \
            "${FILES[@]}"

  # ── 5. Deploy to APT nightly channel ─────────────────────────────────────
  deploy_apt:
    name: Update APT nightly channel
    needs: [publish]
    if: needs.publish.result == 'success'
    uses: ./.github/workflows/cd-deploy-apt.yml
    with:
      tag: ${{ needs.publish.outputs.tag }}
      channel: nightly
    secrets: inherit

  # ── 6. Update AUR nightly package ────────────────────────────────────────
  deploy_aur:
    name: Update AUR nightly package
    needs: [publish]
    if: needs.publish.result == 'success'
    uses: ./.github/workflows/cd-deploy-aur.yml
    with:
      tag: ${{ needs.publish.outputs.tag }}
      channel: nightly
    secrets: inherit

  # ── 7. Post-publish smoke test (warning only, no rollback) ───────────────
  smoke_test:
    name: Smoke test .deb (nightly)
    needs: [publish]
    if: needs.publish.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    continue-on-error: true
    permissions:
      contents: read

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c  # v2.21.0
        with:
          egress-policy: audit

      - name: Download .deb from nightly release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${{ needs.publish.outputs.tag }}"
          mkdir -p ./smoke/
          gh release download "$TAG" \
            --repo "${{ github.repository }}" \
            --pattern "bambustudio_*_amd64.deb" \
            --dir ./smoke/ || {
            echo "::error::gh release download failed for release $TAG (auth/network error or pattern bambustudio_*_amd64.deb matched no assets)"
            exit 1
          }
          DEB=$(find ./smoke/ -name "*.deb" | head -1)
          echo "DEB=$DEB" >> "$GITHUB_ENV"

      - name: Verify .deb integrity
        run: |
          set -euo pipefail
          echo "=== Package info ==="
          dpkg-deb --info "$DEB"
          echo "=== Package contents ==="
          dpkg-deb --contents "$DEB" | tee /tmp/deb_contents.txt
          FILE_COUNT=$(wc -l < /tmp/deb_contents.txt)
          echo "Total files: $FILE_COUNT"
          if [[ "$FILE_COUNT" -lt 10 ]]; then
            echo "::error::.deb contains only $FILE_COUNT entries — package is likely corrupt (expected >=10)"
            exit 1
          fi

      - name: Install .deb
        run: |
          set -euo pipefail
          sudo apt-get update
          # Install via apt with the local .deb path so runtime dependencies
          # (libsecret, libwebkit2gtk, gstreamer, …) are resolved from the
          # archive. `dpkg -i` only unpacks and fails on missing dependencies
          # (the previous `apt-get install -f` fallback did not reliably recover).
          # --fix-missing tolerates a transient apt-mirror 404 on a system dep
          # (matches the shared smoke-test-deb action used by RC/Release).
          sudo apt-get install -y --fix-missing "$(realpath "$DEB")"

      - name: Verify binary present
        run: |
          if command -v bambustudio &>/dev/null; then
            echo "OK: $(which bambustudio)"
          elif [[ -f /usr/lib/bambustudio/bin/bambu-studio ]]; then
            echo "OK: /usr/lib/bambustudio/bin/bambu-studio"
            file /usr/lib/bambustudio/bin/bambu-studio
          else
            echo "::error::bambustudio binary not found after dpkg install"
            dpkg -L bambustudio 2>/dev/null | head -30 || true
            exit 1
          fi

      - name: Post warning on failure
        if: failure()
        run: |
          TAG="${{ needs.publish.outputs.tag }}"
          {
            echo "## ⚠️ Nightly Smoke Test Failed"
            echo ""
            echo "The post-publish smoke test failed for nightly release \`${TAG}\`."
            echo "The release was **not** deleted — investigate the packaging issue manually."
            echo ""
            echo "- Release: https://github.com/${{ github.repository }}/releases/tag/${TAG}"
            echo "- Run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          } >> "$GITHUB_STEP_SUMMARY"
