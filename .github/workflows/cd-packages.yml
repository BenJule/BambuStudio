name: 'CD: Build Packages'
run-name: "Build packages — ${{ github.actor }}"

on:
  workflow_dispatch:
    inputs:
      retention-days:
        description: 'Artifact retention days'
        type: number
        default: 14
      skip-debian:
        description: 'Skip Debian trixie .deb build'
        type: boolean
        default: false
      skip-fedora:
        description: 'Skip Fedora 42 .rpm build'
        type: boolean
        default: false
      skip-ubuntu:
        description: 'Skip Ubuntu AppImage + .deb builds (self-hosted)'
        type: boolean
        default: false
  workflow_call:
    inputs:
      retention-days:
        description: 'Artifact retention days'
        type: number
        default: 14
      skip-debian:
        description: 'Skip Debian trixie .deb build'
        type: boolean
        default: false
      skip-fedora:
        description: 'Skip Fedora 42 .rpm build'
        type: boolean
        default: false
      skip-ubuntu:
        description: 'Skip Ubuntu AppImage + .deb builds (self-hosted)'
        type: boolean
        default: false

permissions: read-all
concurrency:
  group: ${{ github.workflow }}-packages-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ── Debian trixie .deb ───────────────────────────────────────────────────
  build_debian:
    name: Linux / Debian trixie .deb
    if: ${{ !inputs.skip-debian }}
    runs-on: [self-hosted, debian-trixie]
    timeout-minutes: 180
    permissions: read-all
    env:
      CCACHE_DIR: /var/cache/github-runner-debian/ccache
      CCACHE_MAXSIZE: 5G
      CCACHE_SLOPPINESS: pch_defines,time_macros

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
        with:
          lfs: 'true'
          fetch-depth: 0

      - name: Cache deps
        id: cache-deps
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5
        with:
          path: deps/build/destdir
          key: pkg-deps-debian-trixie-selfhosted-${{ hashFiles('deps/CMakeLists.txt', 'deps/**/*.cmake') }}

      - name: Install build dependencies
        run: sudo ./BuildLinux.sh -ur

      - name: Configure ccache
        run: |
          echo "/usr/lib/ccache" >> "$GITHUB_PATH"
          ccache --max-size "$CCACHE_MAXSIZE"
          echo "Cache size before build: $(ccache --show-stats | grep 'Cache size')"
          ccache --zero-stats

      - name: Build deps
        if: steps.cache-deps.outputs.cache-hit != 'true'
        run: ./BuildLinux.sh -dfr

      - name: Build BambuStudio
        id: build-bambu
        run: |
          # -sfr disables the memory formula (DISABLE_PARALLEL_LIMIT=1) and
          # leaves CMAKE_BUILD_PARALLEL_LEVEL unset → cmake falls back to nproc (8).
          # Ubuntu AppImage builds run in parallel VMs on the same physical host,
          # consuming shared RAM. 4 jobs caused OOM when Ubuntu builds were active.
          # 2 jobs keeps Debian within the 6G cgroup limit even under shared load.
          export CMAKE_BUILD_PARALLEL_LEVEL=2
          ./BuildLinux.sh -sfr
          cd build && ./src/BuildLinuxImage.sh

      - name: Smoke test
        if: steps.build-bambu.outcome == 'success'
        run: |
          apt-get install -y --no-install-recommends xvfb

          # Start a virtual framebuffer so GTK/OpenGL init code runs fully
          Xvfb :99 -screen 0 1280x800x24 &
          sleep 2

          # Run bambustudio headlessly for up to 20s and capture all output.
          # Use || to prevent bash -e from exiting on timeout's non-zero code (124).
          EXIT=0
          DISPLAY=:99 LIBGL_ALWAYS_SOFTWARE=1 \
            timeout 20 ./build/src/bambu-studio > /tmp/smoke.log 2>&1 || EXIT=$?

          kill %1 2>/dev/null || true   # stop Xvfb

          # EXIT 124 = timeout killed it after 20s (ran without crashing) → pass
          # EXIT 0   = exited cleanly on its own → pass
          # anything else = crash → fail
          if [ "$EXIT" -ne 0 ] && [ "$EXIT" -ne 124 ]; then
            echo "::error::bambustudio crashed on startup (exit $EXIT)"
            cat /tmp/smoke.log
            exit 1
          fi

          # Fail the build if a known GTK regression is detected
          if grep -q "gtk_window_resize: assertion" /tmp/smoke.log; then
            echo "::error::GTK regression detected: gtk_window_resize assertion 'width > 0' failed"
            grep "Gtk-CRITICAL" /tmp/smoke.log | head -10
            exit 1
          fi

          # Report any remaining GTK warnings as informational
          GTK_WARNS=$(grep -c "Gtk-CRITICAL" /tmp/smoke.log || true)

          echo "### Smoke test" >> "$GITHUB_STEP_SUMMARY"
          echo "✅ Started headless (Xvfb), ran 20s without crash" >> "$GITHUB_STEP_SUMMARY"
          if [ "$GTK_WARNS" -gt 0 ]; then
            echo "⚠️ $GTK_WARNS other Gtk-CRITICAL warning(s) — review log" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "✅ No GTK-CRITICAL warnings" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: ccache statistics
        if: always()
        run: |
          echo "### ccache statistics" >> "$GITHUB_STEP_SUMMARY"
          ccache --show-stats --verbose | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Build package
        run: ./BuildLinux.sh -pr

      - name: Get version
        id: ver
        uses: ./.github/actions/get-version

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: BambuStudio_debian-trixie_deb_${{ steps.ver.outputs.ver }}
          path: ./build/bambustudio_*.deb
          if-no-files-found: error
          retention-days: ${{ inputs.retention-days || 14 }}

  # ── Fedora 42 .rpm ────────────────────────────────────────────────────────
  build_fedora:
    name: Linux / Fedora 42 .rpm
    if: ${{ !inputs.skip-fedora }}
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    container: fedora:42@sha256:7c63468daf71fdc5bda3699cd483b169bb995b5137265d5ffe8f04e2ce87fbb8
    permissions: read-all

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411  # v2.19.4
        with:
          egress-policy: audit

      - name: Bootstrap
        run: dnf install -y sudo git curl git-lfs

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
        with:
          lfs: 'true'
          fetch-depth: 0

      - name: Cache deps
        id: cache-deps
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5
        with:
          path: deps/build/destdir
          key: pkg-deps-fedora42_rpm-${{ hashFiles('deps/CMakeLists.txt', 'deps/**/*.cmake') }}

      - name: Install build dependencies
        run: sudo ./BuildLinux.sh -ur

      - name: Fix permissions
        run: chown -R "$(id -u):$(id -g)" ./

      - name: Install and configure ccache
        run: |
          dnf install -y --setopt=install_weak_deps=False ccache
          echo "/usr/lib64/ccache" >> "$GITHUB_PATH"
          echo "CCACHE_DIR=$HOME/.ccache" >> "$GITHUB_ENV"
          echo "CCACHE_MAXSIZE=5G" >> "$GITHUB_ENV"
          echo "CCACHE_SLOPPINESS=pch_defines,time_macros" >> "$GITHUB_ENV"

      - name: Restore ccache
        id: ccache-restore
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5
        with:
          path: ~/.ccache
          key: ccache-fedora42-${{ hashFiles('src/**/*.cpp', 'src/**/*.c', 'src/**/*.h', 'src/**/*.hpp') }}
          restore-keys: |
            ccache-fedora42-

      - name: Build deps
        if: steps.cache-deps.outputs.cache-hit != 'true'
        run: ./BuildLinux.sh -dfr

      - name: Build BambuStudio
        id: build-bambu
        run: |
          ccache --zero-stats
          ./BuildLinux.sh -sfr
          cd build && ./src/BuildLinuxImage.sh

      - name: ccache statistics
        if: always()
        run: |
          echo "### ccache statistics (Fedora 42)" >> "$GITHUB_STEP_SUMMARY"
          ccache --show-stats --verbose | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Save ccache
        if: steps.build-bambu.outcome == 'success' && steps.ccache-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5
        with:
          path: ~/.ccache
          key: ccache-fedora42-${{ hashFiles('src/**/*.cpp', 'src/**/*.c', 'src/**/*.h', 'src/**/*.hpp') }}

      - name: Build package
        run: bash scripts/build_rpm.sh

      - name: Get version
        id: ver
        uses: ./.github/actions/get-version

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: BambuStudio_fedora42_rpm_${{ steps.ver.outputs.ver }}
          path: ./build/bambustudio-*.rpm
          if-no-files-found: warn
          retention-days: ${{ inputs.retention-days || 14 }}

  # ── Self-hosted distro runners — non-blocking ─────────────────────────────
  build_selfhosted:
    name: Linux / ${{ matrix.name }}
    if: ${{ !inputs.skip-ubuntu }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    continue-on-error: true
    permissions: read-all
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - name: Ubuntu 22.04 AppImage + .deb
            runner: [self-hosted, pve05-ubuntu22]
            pkg_cmd: ./BuildLinux.sh -pr
            artifact_suffix: ubuntu2204
            os_label: ubuntu-22.04
            artifact_deb: ./build/bambustudio_*.deb

          - name: Ubuntu 24.04 AppImage + .deb
            runner: [self-hosted, pve05-ubuntu24]
            pkg_cmd: ./BuildLinux.sh -pr
            artifact_suffix: ubuntu2404
            os_label: ubuntu-24.04
            artifact_deb: ./build/bambustudio_*.deb

          # TODO: re-enable once pve05-opensuse runner is back online
          # - name: openSUSE Tumbleweed AppImage + .rpm
          #   runner: [self-hosted, pve05-opensuse]
          #   pkg_cmd: bash scripts/build_rpm.sh
          #   artifact_suffix: opensuse-tumbleweed
          #   artifact_pkg: ./build/bambustudio-*.rpm

          # TODO: re-enable once pve05-arch runner is back online
          # - name: Arch Linux AppImage + .pkg.tar.zst
          #   runner: [self-hosted, pve05-arch]
          #   pkg_cmd: bash scripts/build_pkg_arch.sh
          #   artifact_suffix: arch
          #   artifact_pkg: ./build/bambustudio-*.pkg.tar.zst

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411  # v2.19.4
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
        with:
          lfs: 'true'
          fetch-depth: 0

      - name: Cache deps
        id: cache-deps
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5
        with:
          path: deps/build/destdir
          key: pkg-deps-${{ matrix.artifact_suffix }}-${{ hashFiles('deps/CMakeLists.txt', 'deps/**/*.cmake') }}

      - name: Install build dependencies
        run: sudo ./BuildLinux.sh -ur

      - name: Fix permissions
        run: sudo chown "$(id -u):$(id -g)" -R ./

      - name: Install and configure ccache
        run: |
          sudo apt-get install -y --no-install-recommends ccache
          echo "/usr/lib/ccache" >> "$GITHUB_PATH"
          echo "CCACHE_DIR=$HOME/.ccache" >> "$GITHUB_ENV"
          echo "CCACHE_MAXSIZE=5G" >> "$GITHUB_ENV"
          echo "CCACHE_SLOPPINESS=pch_defines,time_macros" >> "$GITHUB_ENV"

      - name: Restore ccache
        id: ccache-restore
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5
        with:
          path: ~/.ccache
          key: ccache-${{ matrix.artifact_suffix }}-${{ hashFiles('src/**/*.cpp', 'src/**/*.c', 'src/**/*.h', 'src/**/*.hpp') }}
          restore-keys: |
            ccache-${{ matrix.artifact_suffix }}-

      - name: Build deps
        if: steps.cache-deps.outputs.cache-hit != 'true'
        run: timeout 180m ./BuildLinux.sh -dr

      - name: Get version
        id: ver
        uses: ./.github/actions/get-version

      - name: Build BambuStudio + AppImage
        id: build-bambu
        run: |
          ccache --zero-stats
          timeout 300m ./BuildLinux.sh -isr
          mv -n ./build/BambuStudio_ubu64.AppImage \
            "./build/BambuStudio_${{ matrix.os_label }}_amd64_${{ steps.ver.outputs.ver }}_selfhosted.AppImage" \
            2>/dev/null || true

      - name: ccache statistics
        if: always()
        run: |
          echo "### ccache statistics (${{ matrix.name }})" >> "$GITHUB_STEP_SUMMARY"
          ccache --show-stats --verbose | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Save ccache
        if: steps.build-bambu.outcome == 'success' && steps.ccache-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5
        with:
          path: ~/.ccache
          key: ccache-${{ matrix.artifact_suffix }}-${{ hashFiles('src/**/*.cpp', 'src/**/*.c', 'src/**/*.h', 'src/**/*.hpp') }}

      - name: Build package
        run: ${{ matrix.pkg_cmd }}

      - name: Upload AppImage
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: BambuStudio_${{ matrix.os_label }}_amd64_${{ steps.ver.outputs.ver }}_appimage_selfhosted
          path: ./build/BambuStudio_${{ matrix.os_label }}_amd64_${{ steps.ver.outputs.ver }}_selfhosted.AppImage
          if-no-files-found: warn
          retention-days: ${{ inputs.retention-days || 14 }}

      - name: Upload .deb package
        if: matrix.artifact_deb != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: BambuStudio_${{ matrix.os_label }}_amd64_${{ steps.ver.outputs.ver }}_deb
          path: ${{ matrix.artifact_deb }}
          if-no-files-found: warn
          retention-days: ${{ inputs.retention-days || 14 }}

      - name: Upload native package
        if: matrix.artifact_pkg != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: BambuStudio_${{ matrix.os_label }}_amd64_${{ steps.ver.outputs.ver }}_pkg
          path: ${{ matrix.artifact_pkg }}
          if-no-files-found: warn
          retention-days: ${{ inputs.retention-days || 14 }}
