name: 'CI: PR Build'
run-name: "PR #${{ github.event.pull_request.number }} — ${{ github.event.pull_request.title }}"

on:
  # Run on every PR (no paths filter) so the 'CI Gate' job — used as the
  # required status check on protected branches — always reports a result.
  # The detect job below decides which platforms actually build; docs-only
  # PRs build nothing but still get a green gate (so they aren't blocked).
  pull_request:
    branches:
      - main
      - develop
      - master

permissions: read-all
concurrency:
  group: pr-build-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # ── Detect which platforms are affected by the changed files ───────────────
  detect:
    name: Detect affected platforms
    runs-on: ubuntu-24.04
    outputs:
      debian: ${{ steps.check.outputs.debian }}
      fedora: ${{ steps.check.outputs.fedora }}
      code:   ${{ steps.check.outputs.code }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411  # v2.19.4
        with:
          egress-policy: audit

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          fetch-depth: 0

      - name: Classify changed files
        id: check
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          CHANGED=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")
          echo "Changed files:"
          echo "$CHANGED"

          # C++ / build-system changes affect all platforms
          HAS_CPP=false
          echo "$CHANGED" | grep -qE '^(src/|deps/|(.*/)?CMakeLists\.txt$|version\.inc$)' \
            && HAS_CPP=true

          # Debian-specific: packaging script or debian metadata
          HAS_DEB=false
          echo "$CHANGED" | grep -qE '^(scripts/build_deb\.sh$|linux\.d/debian/)' \
            && HAS_DEB=true

          # Fedora-specific: RPM packaging script or fedora metadata
          HAS_RPM=false
          echo "$CHANGED" | grep -qE '^(scripts/build_rpm\.sh$|linux\.d/fedora/)' \
            && HAS_RPM=true

          # Workflow change → run Debian as sanity check
          HAS_WF=false
          echo "$CHANGED" | grep -qE '^\.github/workflows/' && HAS_WF=true

          # Build Fedora only for pure RPM changes (C++ changes are verified by Debian)
          if [ "$HAS_RPM" = true ] && [ "$HAS_CPP" = false ]; then
            FEDORA=true
          else
            FEDORA=false
          fi

          # Build Debian for everything except a pure RPM-only change or a
          # docs-only / non-build change (docs PRs run the gate but no build).
          if [ "$HAS_CPP" = false ] && [ "$HAS_DEB" = false ] && [ "$HAS_RPM" = false ] && [ "$HAS_WF" = false ]; then
            DEBIAN=false   # nothing build-relevant changed (docs only, etc.)
          elif [ "$FEDORA" = true ] && [ "$HAS_CPP" = false ] && [ "$HAS_DEB" = false ] && [ "$HAS_WF" = false ]; then
            DEBIAN=false
          else
            DEBIAN=true
          fi

          # C++ / build-system changes (src, deps, CMakeLists, version.inc) affect
          # every platform — build macOS + Windows too, to catch platform-specific
          # compile/link failures (e.g. AppleClang constexpr, Win-ARM64 LNK2001) in
          # the PR instead of only after merge in the nightly. deps changes always
          # count as code, so they are never skipped.
          echo "debian=$DEBIAN" >> "$GITHUB_OUTPUT"
          echo "fedora=$FEDORA" >> "$GITHUB_OUTPUT"
          echo "code=$HAS_CPP" >> "$GITHUB_OUTPUT"
          echo "--- Platform decision: debian=$DEBIAN  fedora=$FEDORA  code(macOS/Win)=$HAS_CPP ---"

  # ── Debian trixie .deb ─────────────────────────────────────────────────────
  build_debian:
    name: Linux / Debian trixie .deb
    needs: [detect]
    if: needs.detect.outputs.debian == 'true'
    runs-on: ubuntu-24.04
    # 150 min: a cold deps build (~30 min, e.g. first build after a deps bump)
    # plus the full source compile (~60 min) exceeds the old 90 min limit.
    timeout-minutes: 150
    container: debian:trixie@sha256:4ae67669760b807c19f23902a3fd7c121a6a70cf2ae709035674b23e712e4d62
    permissions: read-all

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411  # v2.19.4
        with:
          egress-policy: audit

      - name: Bootstrap
        run: apt-get update -qq && apt-get install -y sudo git curl git-lfs

      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          lfs: 'true'

      - name: Cache deps
        id: cache-deps
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5
        with:
          path: deps/build/destdir
          key: pkg-deps-debian-trixie_deb-${{ hashFiles('deps/CMakeLists.txt', 'deps/**/*.cmake') }}

      - name: Install build dependencies
        run: sudo ./BuildLinux.sh -ur

      - name: Fix permissions
        run: chown -R "$(id -u):$(id -g)" ./

      - name: Build deps
        if: steps.cache-deps.outputs.cache-hit != 'true'
        run: ./BuildLinux.sh -dfr

      - name: Build BambuStudio
        run: |
          ./BuildLinux.sh -sfr
          cd build && ./src/BuildLinuxImage.sh

      - name: Build package
        run: ./BuildLinux.sh -pr

      - name: Get version
        id: ver
        uses: ./.github/actions/get-version

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: BambuStudio_debian-trixie_deb_${{ steps.ver.outputs.ver }}_PR${{ github.event.pull_request.number }}
          path: ./build/bambustudio_*.deb
          if-no-files-found: error
          retention-days: 7

  # ── Fedora 42 .rpm ─────────────────────────────────────────────────────────
  build_fedora:
    name: Linux / Fedora 42 .rpm
    needs: [detect]
    if: needs.detect.outputs.fedora == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    container: fedora:42@sha256:7c63468daf71fdc5bda3699cd483b169bb995b5137265d5ffe8f04e2ce87fbb8
    permissions: read-all

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411  # v2.19.4
        with:
          egress-policy: audit

      - name: Bootstrap
        run: dnf install -y sudo git curl git-lfs

      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          lfs: 'true'
          fetch-depth: 0

      - name: Cache deps
        id: cache-deps
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5
        with:
          path: deps/build/destdir
          key: pkg-deps-fedora42_rpm-${{ hashFiles('deps/CMakeLists.txt', 'deps/**/*.cmake') }}

      - name: Install build dependencies
        run: sudo ./BuildLinux.sh -ur

      - name: Fix permissions
        run: chown -R "$(id -u):$(id -g)" ./

      - name: Build deps
        if: steps.cache-deps.outputs.cache-hit != 'true'
        run: ./BuildLinux.sh -dfr

      - name: Build BambuStudio
        run: |
          ./BuildLinux.sh -sfr
          cd build && ./src/BuildLinuxImage.sh

      - name: Build package
        run: bash scripts/build_rpm.sh

      - name: Get version
        id: ver
        uses: ./.github/actions/get-version

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: BambuStudio_fedora42_rpm_${{ steps.ver.outputs.ver }}_PR${{ github.event.pull_request.number }}
          path: ./build/bambustudio-*.rpm
          if-no-files-found: warn
          retention-days: 7

  # ── macOS (ARM Universal) — only on src/deps/CMake changes ─────────────────
  # Catches AppleClang/macOS-SDK-specific compile failures (constexpr, WebKit,
  # Assimp bundled zlib) in the PR instead of only in the nightly after merge.
  build_macos:
    name: macOS / macOS 15 ARM Universal
    needs: [detect]
    if: needs.detect.outputs.code == 'true'
    uses: ./.github/workflows/_build-cached.yml
    with:
      os: macos-15
      arch: universal
      build-deps-only: false
    secrets: inherit

  # ── Windows x64 — only on src/deps/CMake changes ───────────────────────────
  # Catches MSVC/Windows-specific compile/link failures (e.g. LNK2001) in the PR.
  build_windows:
    name: Windows / windows-2022 (x64)
    needs: [detect]
    if: needs.detect.outputs.code == 'true'
    uses: ./.github/workflows/_build-cached.yml
    with:
      os: windows-2022
      arch: x64
      build-deps-only: false
    secrets: inherit

  # ── CI Gate — the single required status check on protected branches ───────
  # Runs on every PR and aggregates the (path-aware) build jobs: passes when all
  # needed jobs succeeded or were skipped, fails if any failed/cancelled. Using
  # one always-running gate means docs-only PRs (which skip every build) still
  # get a green required check instead of hanging forever on "expected".
  ci_gate:
    name: CI Gate
    needs: [detect, build_debian, build_fedora, build_macos, build_windows]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Verify required jobs passed (or were skipped)
        run: |
          fail=0
          for jr in "detect:${{ needs.detect.result }}" \
                    "debian:${{ needs.build_debian.result }}" \
                    "fedora:${{ needs.build_fedora.result }}" \
                    "macos:${{ needs.build_macos.result }}" \
                    "windows:${{ needs.build_windows.result }}"; do
            name="${jr%%:*}"; res="${jr#*:}"
            echo "$name: $res"
            if [ "$res" = "failure" ] || [ "$res" = "cancelled" ]; then
              echo "::error::Required job '$name' did not pass ($res)"
              fail=1
            fi
          done
          if [ "$fail" -ne 0 ]; then exit 1; fi
          echo "All required build jobs passed or were skipped — gate green."
