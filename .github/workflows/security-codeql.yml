name: 'Security: CodeQL'
run-name: "CodeQL — ${{ github.ref_name }}"

on:
  push:
    branches: [master]
    paths:
      - 'src/**'
      - '**/CMakeLists.txt'
  pull_request:
    branches: [master]
    paths:
      - 'src/**'
  schedule:
    - cron: '0 4 * * 1'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: read-all

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        language: [c-cpp]

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25  # v2.22.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          submodules: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d  # v4.38.3
        with:
          languages: ${{ matrix.language }}
          build-mode: manual
          # security-and-quality = security-extended plus maintainability/
          # reliability (code-quality) queries — the most thorough suite.
          queries: security-and-quality

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build gcc g++ \
            libgtk-3-dev libglu1-mesa-dev libgl1-mesa-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            libdbus-1-dev libsecret-1-dev libwebkit2gtk-4.1-dev \
            libssl-dev libcurl4-openssl-dev libudev-dev \
            libxkbcommon-dev nasm yasm

      - name: Configure (source only, no deps)
        run: |
          cmake -S . -B build/codeql -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBBL_RELEASE_TO_PUBLIC=1 \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            || true

      - name: Build for CodeQL
        run: |
          cmake --build build/codeql --target BambuStudio \
            --parallel 4 2>&1 | head -5000 || true

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d  # v4.38.3
        with:
          category: "/language:${{ matrix.language }}"
