name: 'CI: Build Debian trixie container'
run-name: "Build debian-trixie image — ${{ github.ref_name }}"

on:
  schedule:
    - cron: '0 3 * * 1'  # weekly Monday 03:00 UTC — tracks upstream debian:trixie updates
  push:
    paths:
      - 'docker/Dockerfile.debian-trixie'
      - '.github/workflows/ci-debian-container.yml'
  workflow_dispatch:

permissions: read-all

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and push debian:trixie image
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c  # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e  # v4.3.0

      - name: Log in to ghcr.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set lowercase owner
        run: echo "IMAGE_OWNER=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7.3.0
        with:
          context: docker
          file: docker/Dockerfile.debian-trixie
          push: true
          # No build attestation — avoids the extra "unknown/unknown" manifest
          # entry GHCR shows for the provenance attestation.
          provenance: false
          tags: |
            ghcr.io/${{ env.IMAGE_OWNER }}/bambu-debian-trixie:trixie
            ghcr.io/${{ env.IMAGE_OWNER }}/bambu-debian-trixie:latest
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ github.event.head_commit.timestamp }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
