name: Smoke test .deb
description: Verify a Debian package is well-formed, installs cleanly, and contains the bambustudio binary.

inputs:
  deb-path:
    description: Path to the .deb file to test
    required: true

runs:
  using: composite
  steps:
    - name: Verify .deb integrity
      shell: bash
      run: |
        echo "=== Package info ==="
        dpkg-deb --info "${{ inputs.deb-path }}"
        echo "=== Package contents ==="
        dpkg-deb --contents "${{ inputs.deb-path }}" | tee /tmp/deb_contents.txt
        FILE_COUNT=$(wc -l < /tmp/deb_contents.txt)
        echo "Total files: $FILE_COUNT"
        if [ "$FILE_COUNT" -lt 10 ]; then
          echo "::error::.deb contains only $FILE_COUNT entries — package likely corrupt (expected ≥10)"
          exit 1
        fi

    - name: Install .deb
      shell: bash
      run: |
        sudo apt-get update -qq
        # Install via apt with the local .deb path so runtime dependencies
        # (libsecret, libwebkit2gtk, gstreamer, …) are resolved from the archive.
        # `dpkg -i` only unpacks and fails on missing dependencies. --fix-missing
        # lets the install proceed if a system dep transiently 404s on the apt
        # mirror; the shared-library check below treats such webkit/gstreamer gaps
        # as a warning rather than a packaging defect.
        sudo apt-get install -y --fix-missing "$(realpath "${{ inputs.deb-path }}")"

    - name: Verify binary present
      shell: bash
      run: |
        # /usr/bin/bambustudio is a thin wrapper shell script that sets
        # LD_LIBRARY_PATH and execs the real ELF. ldd on the wrapper fails
        # ("not a dynamic executable"), so resolve the packaged ELF directly.
        if [ -x /usr/lib/bambustudio/bin/bambu-studio ]; then
          BINARY=/usr/lib/bambustudio/bin/bambu-studio
        elif command -v bambustudio &>/dev/null; then
          BINARY=$(which bambustudio)
        else
          echo "::error::bambustudio binary not found after dpkg install"
          dpkg -L bambu-studio 2>/dev/null | head -30 || true
          exit 1
        fi
        echo "OK: $BINARY"
        file "$BINARY"
        echo "BAMBU_BINARY=$BINARY" >> "$GITHUB_ENV"
        # The wrapper adds this to LD_LIBRARY_PATH at runtime; ldd/--version on
        # the real ELF need it too, else the bundled libs report "not found".
        echo "BAMBU_LIBDIR=/usr/lib/bambustudio" >> "$GITHUB_ENV"

    - name: Verify shared libraries
      shell: bash
      run: |
        MISSING=$(LD_LIBRARY_PATH="${BAMBU_LIBDIR:-}" ldd "$BAMBU_BINARY" 2>/dev/null | grep "not found" || true)
        if [[ -n "$MISSING" ]]; then
          # webkit2gtk / javascriptcoregtk / gstreamer are external system deps
          # pulled in by apt at install time. On GitHub runners the apt mirror can
          # transiently 404 on them, so --fix-missing skips them and ldd reports
          # them as "not found" — a runner/mirror issue, not a packaging defect
          # (the .deb declares them correctly). Treat those as a warning; only
          # fail on genuinely missing core libraries.
          CRITICAL=$(echo "$MISSING" | grep -ivE "libwebkit2gtk|libjavascriptcoregtk|libgst|gstreamer" || true)
          if [[ -n "$CRITICAL" ]]; then
            echo "::error::Missing core shared libraries in $BAMBU_BINARY:"
            echo "$CRITICAL"
            exit 1
          fi
          echo "::warning::Some optional/system libs reported missing — likely a transient apt-mirror 404 for webkit/gstreamer, not a packaging defect:"
          echo "$MISSING"
        fi
        LIB_COUNT=$(LD_LIBRARY_PATH="${BAMBU_LIBDIR:-}" ldd "$BAMBU_BINARY" 2>/dev/null | wc -l || true)
        echo "OK: $LIB_COUNT shared libraries listed (core libs resolved)"

    - name: Verify resources
      shell: bash
      run: |
        RESOURCE_DIR=""
        for d in /usr/lib/bambustudio/resources /usr/share/bambustudio/resources; do
          [[ -d "$d" ]] && RESOURCE_DIR="$d" && break
        done
        if [[ -z "$RESOURCE_DIR" ]]; then
          echo "::error::Resources directory not found under /usr/lib or /usr/share"
          exit 1
        fi
        echo "Resource dir: $RESOURCE_DIR"
        if [[ ! -d "$RESOURCE_DIR/profiles" ]]; then
          echo "::error::Profiles directory missing from $RESOURCE_DIR"
          exit 1
        fi
        PROFILE_COUNT=$(find "$RESOURCE_DIR/profiles" -name "*.json" 2>/dev/null | wc -l)
        echo "OK: $PROFILE_COUNT printer profile files found"
        IMAGE_COUNT=$(find "$RESOURCE_DIR" \( -name "*.svg" -o -name "*.png" \) 2>/dev/null | wc -l)
        echo "OK: $IMAGE_COUNT image assets found"

    - name: Check version string
      shell: bash
      run: |
        PKG_VERSION=$(dpkg-query -W -f='${Version}' bambu-studio 2>/dev/null \
          || dpkg-query -W -f='${Version}' bambustudio 2>/dev/null || true)
        CLI_VERSION=$(LD_LIBRARY_PATH="${BAMBU_LIBDIR:-}" "$BAMBU_BINARY" --version 2>/dev/null | head -1 || true)
        if [[ -n "$CLI_VERSION" ]]; then
          echo "CLI version:     $CLI_VERSION"
        fi
        echo "Package version: ${PKG_VERSION:-(unknown)}"
        if [[ -z "$PKG_VERSION" && -z "$CLI_VERSION" ]]; then
          echo "::warning::Could not determine version from CLI or dpkg"
        fi
